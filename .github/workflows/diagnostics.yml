name: VM Diagnostics
# retry: check latest ICP run results + Activity Log attribution

on:
  push:
    branches: [claude/jolly-dirac-7qhyvi]
    paths:
      - '.github/workflows/diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: VM
    steps:
      - name: Check VM services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "### LATEST ICP RUN + ACTIVITY LOG ATTRIBUTION CHECK ###"
            echo "--- most recent icp_runs rows (status/timestamps/counts) ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
              "SELECT id, icp_id, started_at, finished_at, status, leads_found, leads_new FROM icp_runs ORDER BY id DESC LIMIT 5;" 2>&1
            echo "--- full log of the most recent run ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -t -c \
              "SELECT log FROM icp_runs ORDER BY id DESC LIMIT 1;" 2>&1
            echo "--- the ICP profile that run belongs to ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
              "SELECT p.id, p.name, p.industries, p.geos, p.min_lead_score FROM icp_profiles p ORDER BY p.id DESC LIMIT 3;" 2>&1
            echo "--- the actual leads that ICP run found (most recently touched profile) ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
              "SELECT l.id, l.business_name, l.niche, l.city, l.ai_score, l.icp_score, l.status, l.website, l.phone \
               FROM leads l WHERE l.icp_id = (SELECT icp_id FROM icp_runs ORDER BY id DESC LIMIT 1) \
               ORDER BY l.id DESC LIMIT 20;" 2>&1
            echo "--- most recent api_usage rows (does M12 attribution actually work on a real run?) ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
              "SELECT created_at, username, provider, endpoint, cost, meta FROM api_usage ORDER BY id DESC LIMIT 25;" 2>&1
            echo "--- api_usage username breakdown, last 2 hours (any NULLs where a real user should be attributed?) ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
              "SELECT COALESCE(username,'(NULL)') as username, COUNT(*), SUM(cost) FROM api_usage \
               WHERE created_at > NOW() - INTERVAL '2 hours' GROUP BY username ORDER BY COUNT(*) DESC;" 2>&1
            echo

            echo "### ROOT CAUSE TEST: does deploy.yml's plain (non-sudo) systemctl restart actually work over SSH? ###"
            echo "--- ActiveEnterTimestamp BEFORE test ---"
            systemctl show leadgen-api --property=ActiveEnterTimestamp --no-pager
            echo "--- whoami / groups / passwordless sudo? ---"
            whoami
            groups
            sudo -n true 2>&1 && echo "passwordless sudo: YES" || echo "passwordless sudo: NO / needs password"
            echo "--- running: systemctl restart leadgen-api (NO sudo — exactly what deploy.yml runs) ---"
            systemctl restart leadgen-api 2>&1
            echo "exit code: $?"
            sleep 4
            echo "--- ActiveEnterTimestamp AFTER plain restart attempt (compare to BEFORE) ---"
            systemctl show leadgen-api --property=ActiveEnterTimestamp --no-pager
            echo "--- is-active after plain restart attempt ---"
            systemctl is-active leadgen-api
            echo

            echo "### leadgen-api ###"
            systemctl status leadgen-api --no-pager || true
            echo
            echo "### docker ps ###"
            docker ps || true
            echo
            echo "### xray (REALITY VPN) ###"
            sudo systemctl status xray --no-pager || true
            echo
            echo "### openvpn-server@server2 ###"
            sudo systemctl status openvpn-server@server2 --no-pager || true
            echo
            echo "### recent leadgen-api logs ###"
            journalctl -u leadgen-api -n 50 --no-pager || true
            echo
            echo "### when did leadgen-api actually last (re)start? ###"
            systemctl show leadgen-api --property=ActiveEnterTimestamp --no-pager
            echo "### full startup log since last restart ###"
            journalctl -u leadgen-api --since "30 minutes ago" --no-pager | grep -E "Schema migration|Auth:|WARNING: auth|Client role account|migration warning|Multi-Module|Listening on" || echo "(no migration/startup log lines found in the last 30 minutes)"
            echo "--- does the client role account actually exist in the DB? ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -t -c "SELECT username, role FROM auth_users;" 2>&1 || echo "(could not query auth_users)"
            echo "--- does the lead_research table exist (M7 migration)? ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -t -c "\dt lead_research" 2>&1 || echo "(could not query)"
            echo "--- is leads_api.py on disk actually the new version? (grep for an M7-only string) ---"
            grep -c "AI RESEARCH & PAIN DETECTION" /opt/leadgen/leads_api.py 2>&1 || echo "0 (old version still on disk!)"
            echo
            echo "### if the process is stale relative to the file on disk, force a real restart ###"
            sudo systemctl restart leadgen-api
            sleep 5
            echo "Restart result: $(systemctl is-active leadgen-api)"
            systemctl show leadgen-api --property=ActiveEnterTimestamp --no-pager
            echo "--- health check post-restart ---"
            curl -s http://localhost:8080/health || true
            echo
            echo "--- client account now seeded? ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -t -c "SELECT username, role FROM auth_users;" 2>&1 || true
            echo "--- fresh startup log ---"
            journalctl -u leadgen-api --since "1 minute ago" --no-pager | grep -E "Schema migration|Auth:|Client role account|WARNING" || echo "(nothing yet)"
            echo
            echo "### disk / memory ###"
            df -h /
            free -h
            echo
            echo "### health endpoint ###"
            curl -s http://localhost:8080/health || true
            echo
            echo "### reverse proxy (caddy/nginx) ###"
            systemctl is-active caddy 2>/dev/null && echo "caddy: active" || echo "caddy: not active/not installed"
            systemctl is-active nginx 2>/dev/null && echo "nginx: active" || echo "nginx: not active/not installed"
            echo "--- Caddyfile ---"
            cat /etc/caddy/Caddyfile 2>/dev/null || echo "(no /etc/caddy/Caddyfile)"
            echo "--- nginx sites-enabled ---"
            ls /etc/nginx/sites-enabled/ 2>/dev/null && cat /etc/nginx/sites-enabled/* 2>/dev/null || echo "(no nginx sites-enabled)"
            echo
            echo "### firewall — is 8080 exposed publicly? ###"
            sudo ufw status 2>/dev/null || echo "(ufw not active/installed)"
            echo
            echo "### public IP + domain check ###"
            PUBIP=$(curl -s ifconfig.me || echo unknown)
            echo "Public IP: $PUBIP"
            echo "--- does app.controvallc.com resolve, and to what? ---"
            getent hosts app.controvallc.com || echo "app.controvallc.com does not resolve"
            echo "--- end-to-end HTTPS test from the VM itself ---"
            curl -sk -o /dev/null -w "https://app.controvallc.com -> HTTP %{http_code}\n" --max-time 8 https://app.controvallc.com/health || echo "https://app.controvallc.com unreachable"
            echo
            echo "### caddy status + recent journal (did the cert actually get issued?) ###"
            sudo systemctl status caddy --no-pager || true
            echo "--- last 40 caddy log lines ---"
            sudo journalctl -u caddy -n 40 --no-pager || true

      - name: DNS + cert deep-dive from the internet (this runner, not the VM)
        run: |
          echo "### nameservers for controvallc.com ###"
          dig +short NS controvallc.com || nslookup -type=NS controvallc.com
          echo
          echo "### A/CNAME chain for app.controvallc.com ###"
          dig +short A app.controvallc.com || true
          dig +short CNAME app.controvallc.com || true
          echo
          echo "### fresh cert chain check ###"
          timeout 15 bash -c "echo | openssl s_client -connect app.controvallc.com:443 -servername app.controvallc.com -showcerts 2>&1" | grep -E "subject=|issuer=|Verify return code" | head -10 || echo "(openssl check timed out or failed)"
          curl -vI --max-time 10 https://app.controvallc.com/ 2>&1 | grep -iE "subject:|issuer:|SSL certificate" || true
          echo "--- HTTP->HTTPS redirect working? ---"
          curl -s -o /dev/null -w "http://app.controvallc.com -> HTTP %{http_code}, redirect to: %{redirect_url}\n" http://app.controvallc.com/ || true
          echo
          echo "### final health check ###"
          curl -s --max-time 10 https://app.controvallc.com/health || echo "unreachable"
