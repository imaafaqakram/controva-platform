name: VM Diagnostics
# Read-only live checks against the production VM, plus a standing
# end-to-end smoke test of the workflow engine. Deliberately has no
# restart/service-management commands: this file's own content used
# to include two unconditional `systemctl restart leadgen-api` calls
# left over from a one-time investigation, and every single push to
# this file (including ones only changing the checks themselves) was
# silently restarting production and killing whatever background job
# happened to be running at the time. Keep it that way — add new
# checks freely, never add a restart here again.

on:
  push:
    branches: [claude/jolly-dirac-7qhyvi]
    paths:
      - '.github/workflows/diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: VM
    steps:
      - name: Check VM services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "### TENANT ISOLATION LIVE VERIFICATION — does the fix actually isolate a client account? ###"
            TOKEN=$(python3 -c "import json; print(json.load(open('/opt/leadgen/config.json')).get('service_token',''))" 2>/dev/null)
            echo "--- auth_users: does every account now have its own distinct tenant_id? ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c "SELECT username, role, tenant_id FROM auth_users ORDER BY username;" 2>&1
            echo "--- tenants table: one row per account now? ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c "SELECT id, name, created_at FROM tenants ORDER BY created_at;" 2>&1
            echo "--- creating a throwaway test client account via the new admin-only endpoint ---"
            CREATE_RESP=$(curl -s -X POST http://localhost:8080/users/create \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d '{"username":"_diag_test_client","password":"Diag-Test-Pass-987654"}')
            echo "create response: $CREATE_RESP"
            LOGIN_RESP=$(curl -s -X POST http://localhost:8080/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"_diag_test_client","password":"Diag-Test-Pass-987654"}')
            CLIENT_TOKEN=$(echo "$LOGIN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
            echo "got client token: $([ -n \"$CLIENT_TOKEN\" ] && echo yes || echo NO)"
            TEST_TENANT=$(docker exec leadgen_postgres psql -U leadgen -d leadgen_db -t -A -c "SELECT tenant_id FROM auth_users WHERE username='_diag_test_client';" 2>/dev/null)
            echo "test client's tenant_id: $TEST_TENANT"
            echo "--- /leads as the brand-new test client, before anything is tagged to them — MUST be 0 ---"
            curl -s "http://localhost:8080/leads" -H "Authorization: Bearer $CLIENT_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('total:', d.get('total'))" 2>&1
            echo "--- /config as the test client — MUST NOT contain enrichment_strategy or other internal keys ---"
            curl -s "http://localhost:8080/config" -H "Authorization: Bearer $CLIENT_TOKEN"
            echo
            echo "--- /cost-stats as the test client — MUST be rejected (admin-only) ---"
            curl -s -o /dev/null -w "http_code: %{http_code}\n" "http://localhost:8080/cost-stats" -H "Authorization: Bearer $CLIENT_TOKEN"
            ONE_LEAD=$(docker exec leadgen_postgres psql -U leadgen -d leadgen_db -t -A -c "SELECT id FROM leads WHERE lead_type IS NULL LIMIT 1;" 2>/dev/null)
            echo "--- tagging exactly one pre-existing (admin's) lead to the test tenant via direct SQL, to prove filtering works without spending real API credits ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c "UPDATE leads SET tenant_id='$TEST_TENANT' WHERE id='$ONE_LEAD';" 2>&1
            echo "--- /leads as the test client AFTER tagging — MUST now be exactly 1 ---"
            curl -s "http://localhost:8080/leads" -H "Authorization: Bearer $CLIENT_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('total:', d.get('total'))" 2>&1
            echo "--- /leads with the service token (unscoped/admin-equivalent) — MUST be the full, unaffected total ---"
            curl -s "http://localhost:8080/leads" -H "Authorization: Bearer $TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('total:', d.get('total'))" 2>&1
            echo "--- cleanup: untag the lead, delete the test account ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c "UPDATE leads SET tenant_id=NULL WHERE id='$ONE_LEAD';" 2>&1
            curl -s -X POST "http://localhost:8080/users/_diag_test_client/delete" -H "Authorization: Bearer $TOKEN"
            echo
            echo "--- confirming cleanup ---"
            docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c "SELECT COUNT(*) FROM auth_users WHERE username='_diag_test_client';" 2>&1
            unset TOKEN CREATE_RESP LOGIN_RESP CLIENT_TOKEN TEST_TENANT ONE_LEAD

            echo "### END-TO-END WORKFLOW ENGINE TEST (live API, all 12 node types, disconnected so every node takes its safe/zero-cost early-return branch — no leads touched, no cost) ###"
            TOKEN=$(python3 -c "import json; print(json.load(open('/opt/leadgen/config.json')).get('service_token',''))" 2>/dev/null)
            if [ -z "$TOKEN" ]; then
              echo "no service_token found in config.json — skipping live API test"
            else
              echo "--- creating a throwaway test workflow (all 12 node types, no edges — each hits its cheapest branch: missing config or empty input_ids) ---"
              SAVE_RESP=$(curl -s -X POST http://localhost:8080/workflows/save \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d '{"name":"_diagnostic_e2e_test_delete_me","graph":{"nodes":[{"id":"n1","type":"search","x":0,"y":0,"config":{}},{"id":"n2","type":"icp_search","x":0,"y":0,"config":{}},{"id":"n3","type":"intent_search","x":0,"y":0,"config":{}},{"id":"n4","type":"enrich","x":0,"y":0,"config":{}},{"id":"n5","type":"verify_websites","x":0,"y":0,"config":{}},{"id":"n6","type":"verify_emails","x":0,"y":0,"config":{}},{"id":"n7","type":"score","x":0,"y":0,"config":{}},{"id":"n8","type":"filter_score","x":0,"y":0,"config":{}},{"id":"n9","type":"research","x":0,"y":0,"config":{}},{"id":"n10","type":"generate_assets","x":0,"y":0,"config":{}},{"id":"n11","type":"crm_push","x":0,"y":0,"config":{}},{"id":"n12","type":"send_email","x":0,"y":0,"config":{}}],"edges":[]}}')
              echo "save response: $SAVE_RESP"
              WF_ID=$(echo "$SAVE_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
              echo "workflow id: $WF_ID"
              if [ -n "$WF_ID" ]; then
                echo "--- running it ---"
                RUN_RESP=$(curl -s -X POST http://localhost:8080/workflows/run \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -d "{\"id\": $WF_ID}")
                echo "run response: $RUN_RESP"
                JOB_ID=$(echo "$RUN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('job_id',''))" 2>/dev/null)
                echo "job id: $JOB_ID"
                for i in 1 2 3 4 5; do
                  sleep 1
                  STATUS_RESP=$(curl -s "http://localhost:8080/job/$JOB_ID" -H "Authorization: Bearer $TOKEN")
                  echo "poll $i: $STATUS_RESP"
                  echo "$STATUS_RESP" | grep -q '"status": *"completed"' && break
                done
                echo "--- any per-node ERROR lines? (would mean one of the 6 new handlers has a bug — e.g. a typo'd function name) ---"
                echo "$STATUS_RESP" | grep -o '"ERROR[^"]*"' || echo "(none — all 12 node types executed cleanly)"
                echo "--- confirming the run actually landed in wf_canvas_runs, with all 12 nodes present in node_results ---"
                docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
                  "SELECT id, workflow_id, status, started_at, finished_at, node_results FROM wf_canvas_runs WHERE workflow_id=$WF_ID;" 2>&1
                echo "--- confirming GET /workflows reflects it ---"
                curl -s "http://localhost:8080/workflows" -H "Authorization: Bearer $TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); m=[w for w in d.get('workflows',[]) if w['id']==$WF_ID]; print('found:', m[0] if m else 'NOT FOUND')"
                echo "--- cleaning up the test workflow ---"
                curl -s -X POST "http://localhost:8080/workflows/$WF_ID/delete" -H "Authorization: Bearer $TOKEN"
                echo
                echo "--- confirming cleanup (cascade should remove the wf_canvas_runs row too) ---"
                docker exec leadgen_postgres psql -U leadgen -d leadgen_db -c \
                  "SELECT COUNT(*) FROM workflows WHERE id=$WF_ID; SELECT COUNT(*) FROM wf_canvas_runs WHERE workflow_id=$WF_ID;" 2>&1
              fi
            fi
            unset TOKEN SAVE_RESP RUN_RESP STATUS_RESP

      - name: DNS + cert deep-dive from the internet (this runner, not the VM)
        run: |
          echo "### nameservers for controvallc.com ###"
          dig +short NS controvallc.com || nslookup -type=NS controvallc.com
          echo
          echo "### A/CNAME chain for app.controvallc.com ###"
          dig +short A app.controvallc.com || true
          dig +short CNAME app.controvallc.com || true
          echo
          echo "### fresh cert chain check ###"
          timeout 15 bash -c "echo | openssl s_client -connect app.controvallc.com:443 -servername app.controvallc.com -showcerts 2>&1" | grep -E "subject=|issuer=|Verify return code" | head -10 || echo "(openssl check timed out or failed)"
          curl -vI --max-time 10 https://app.controvallc.com/ 2>&1 | grep -iE "subject:|issuer:|SSL certificate" || true
          echo "--- HTTP->HTTPS redirect working? ---"
          curl -s -o /dev/null -w "http://app.controvallc.com -> HTTP %{http_code}, redirect to: %{redirect_url}\n" http://app.controvallc.com/ || true
          echo
          echo "### final health check ###"
          curl -s --max-time 10 https://app.controvallc.com/health || echo "unreachable"
