version: "3.9"

# Local development / second machine setup.
# Uses Docker-managed named volumes so it works on Windows, Mac, or Linux
# without needing /opt/leadgen to exist.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   python server/leads_api.py

services:

  postgres:
    image: postgres:16-alpine
    container_name: leadgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: LeadGen_Secure_2024!
      POSTGRES_DB: leadgen_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadgen_redis
    restart: unless-stopped
    command: redis-server --requirepass "Redis_Secure_2024!" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: leadgen_crawl4ai
    restart: unless-stopped
    environment:
      - CRAWL4AI_API_TOKEN=crawl4ai_secret_token_2024
    ports:
      - "11235:11235"
    shm_size: "1gb"
    volumes:
      - crawl4ai_data:/crawl4ai

volumes:
  postgres_data:
  redis_data:
  crawl4ai_data:
