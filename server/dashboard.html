<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          // Theme-aware brand color: pinkish red on the white/light theme,
          // light sea green on the black/dark theme. Values come from CSS
          // variables (see :root / .dark below) so every existing
          // accent-* class (100+ usages) repaints automatically per theme —
          // no need to touch each call site individually.
          accent: {
            50:  'rgb(var(--accent-50) / <alpha-value>)',
            100: 'rgb(var(--accent-100) / <alpha-value>)',
            200: 'rgb(var(--accent-200) / <alpha-value>)',
            300: 'rgb(var(--accent-300) / <alpha-value>)',
            400: 'rgb(var(--accent-400) / <alpha-value>)',
            500: 'rgb(var(--accent-500) / <alpha-value>)',
            600: 'rgb(var(--accent-600) / <alpha-value>)',
            700: 'rgb(var(--accent-700) / <alpha-value>)',
            800: 'rgb(var(--accent-800) / <alpha-value>)',
            900: 'rgb(var(--accent-900) / <alpha-value>)',
          },
        },
        fontFamily: {
          sans: ['Manrope', 'system-ui', 'sans-serif'],
          display: ['"Funnel Display"', 'Manrope', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>

<script>
  // Global error handler - show errors visibly so we can debug
  window.addEventListener('error', function(e) {
    var d = document.getElementById('error-display');
    if (d) {
      d.style.display = 'block';
      d.textContent = 'Error: ' + e.message + '\n\nFile: ' + e.filename + ':' + e.lineno + '\n\n' + (e.error && e.error.stack ? e.error.stack : '');
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    var d = document.getElementById('error-display');
    if (d) {
      d.style.display = 'block';
      d.textContent = 'Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });

  // Update loading status as scripts load
  var statusEl = document.getElementById('load-status');
  var checkInterval = setInterval(function() {
    if (!statusEl) { clearInterval(checkInterval); return; }
    var loaded = [];
    if (window.React) loaded.push('React');
    if (window.ReactDOM) loaded.push('ReactDOM');
    if (window.Babel) loaded.push('Babel');
    statusEl.textContent = 'Loaded: ' + loaded.join(', ');
    if (loaded.length === 3) clearInterval(checkInterval);
  }, 200);
</script>

// SVG icon component
const Icon = ({ name, className = "w-4 h-4", size, strokeWidth = 2 }) => {
  const path = ICONS[name];
  if (!path) return null;
  // size (pixels) takes priority over className's w-/h- classes when given —
  // without this, className overrides that drop the default "w-4 h-4" (e.g.
  // className="text-white") left the <svg> with no width/height at all,
  // so it rendered at whatever size its flex/block context allowed —
  // sometimes 600px+, blowing out the whole layout.
  const style = size ? { width: size, height: size, minWidth: size, minHeight: size } : undefined;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}>
      {path.split('M').filter(Boolean).map((p, i) => <path key={i} d={'M' + p} />)}
    </svg>
  );
};

const { useState, useEffect, useCallback, useMemo, useRef } = React;
const API = window.location.origin;

// ─────────────────────────────────────────────────
//  Theme
// ─────────────────────────────────────────────────
const useTheme = () => {
  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem('theme');
      if (saved) return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem('theme', theme); } catch (e) {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
};

// ─────────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────────
const ToastContext = React.createContext({ showToast: () => {} });
const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const showToast = useCallback((message, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5000);
  }, []);
  return (
    <ToastContext.Provider value={{ showToast }}>
      {children}
      <div className="fixed top-4 right-4 z-50 space-y-2">
        {toasts.map(t => (
          <div key={t.id} className={'fade-in glass max-w-md px-4 py-3 rounded-lg shadow-lg border ' + (
            t.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-700 dark:text-red-300' :
            t.type === 'info' ? 'bg-accent-500/10 border-accent-500/30 text-accent-700 dark:text-accent-300' :
            'bg-green-500/10 border-green-500/30 text-green-700 dark:text-green-300'
          )}>
            <div className="flex items-start gap-2">
              <Icon name={t.type === 'error' ? 'AlertCircle' : t.type === 'info' ? 'Info' : 'CheckCircle2'} className="w-5 h-5 flex-shrink-0 mt-0.5" />
              <p className="text-sm">{t.message}</p>
            </div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = () => React.useContext(ToastContext);

// ─────────────────────────────────────────────────
//  API helper
// ─────────────────────────────────────────────────
const api = {
  get: async (path) => {
    const token = localStorage.getItem('auth_token');
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(API + path, { headers });
    if (!r.ok) {
      let errText = 'HTTP ' + r.status;
      try {
        const errJson = await r.json();
        if (errJson && errJson.error) errText = errJson.error;
      } catch (e) {}
      throw new Error(errText);
    }
    return r.json();
  },
  post: async (path, body) => {
    const token = localStorage.getItem('auth_token');
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(API + path, {
      method: 'POST',
      headers,
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let errText = 'HTTP ' + r.status;
      try {
        const errJson = await r.json();
        if (errJson && errJson.error) errText = errJson.error;
      } catch (e) {}
      throw new Error(errText);
    }
    return r.json();
  }
};

const SearchPage = ({ setPage }) => {
  // Persist the active search across tab navigation (component unmounts on nav)
  const savedJob = (() => { try { return localStorage.getItem('search_active_job') || null; } catch (e) { return null; } })();
  const [query, setQuery] = useState('');
  const [loading, setLoading] = useState(!!savedJob);
  const [result, setResult] = useState(() => {
    try { return JSON.parse(localStorage.getItem('search_last_result') || 'null'); } catch (e) { return null; }
  });
  const [filterMode, setFilterMode] = useState('all');  // all | no_website | with_website
  const [density, setDensity] = useState('standard');  // low | standard | high
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem('search_history') || '[]'); } catch (e) { return []; }
  });
  const { showToast } = useToast();
  const [job, setJob] = useState(savedJob ? { status: 'running', progress: 0, log: ['Resuming search…'], step: 'Discover' } : null);
  const [jobId, setJobId] = useState(savedJob);
  const [lastQuery, setLastQuery] = useState(() => {
    try { return localStorage.getItem('search_last_query') || ''; } catch (e) { return ''; }
  });

  // Keep the last completed result + active job persisted so they survive
  // navigating to another tab and coming back.
  useEffect(() => {
    try {
      if (result) localStorage.setItem('search_last_result', JSON.stringify(result));
    } catch (e) {}
  }, [result]);
  useEffect(() => {
    try {
      if (jobId) localStorage.setItem('search_active_job', jobId);
      else localStorage.removeItem('search_active_job');
    } catch (e) {}
  }, [jobId]);

  const examples = [
    { q: 'barber shops in Manchester UK', emoji: '💇' },
    { q: 'luxury restaurants in Beverly Hills', emoji: '🍽️' },
    { q: 'dental clinics in Mumbai India', emoji: '🦷' },
    { q: 'restaurants in Lahore Pakistan', emoji: '🍛' },
    { q: 'salons in Karachi', emoji: '✂️' },
    { q: 'gyms in Toronto Canada', emoji: '💪' },
    { q: 'beauty salons in Sydney Australia', emoji: '💅' },
    { q: 'pharmacies in Dubai UAE', emoji: '💊' },
    { q: 'cafes in Singapore', emoji: '☕' },
    { q: 'bakeries in Manchester', emoji: '🥖' },
  ];

  // Poll the background discovery job for live progress
  useEffect(() => {
    if (!jobId) return;
    const poll = setInterval(async () => {
      try {
        const j = await api.get('/job/' + jobId);
        setJob(j);
        if (j.status === 'completed') {
          clearInterval(poll); setLoading(false); setJobId(null);
          const res = j.results || {};
          const r = {
            status: res.discover_status || 'success',
            parsed: { niche: res.niche, city: res.city, country: res.country },
            filter_mode: res.filter_mode, density: res.density,
            total_new_leads: res.total_new_leads ?? 0,
            leads: res.leads || [],
            message: res.message || null,
            batch_id: jobId || null,
          };
          setResult(r);
          const sq = lastQuery;
          if (sq) {
            const newHistory = [{ query: sq, time: Date.now(), result: r }, ...history.filter(h => h.query !== sq)].slice(0, 10);
            setHistory(newHistory);
            try { localStorage.setItem('search_history', JSON.stringify(newHistory)); } catch (e) {}
          }
          if (res.discover_status === 'geocode_failed') showToast('Could not find that location — add the country', 'error');
          else if ((res.total_new_leads ?? 0) === 0) showToast(res.discover_status === 'exhausted' ? 'Area fully explored — no new leads left' : 'No new leads this round — try Find More', 'info');
          else showToast('Found ' + res.total_new_leads + ' new businesses!', 'success');
        } else if (j.status === 'failed') {
          clearInterval(poll); setLoading(false); setJobId(null);
          showToast('Search failed: ' + (j.error || 'unknown error'), 'error');
        }
      } catch (e) { /* transient — keep polling */ }
    }, 2000);
    return () => clearInterval(poll);
  }, [jobId]);

  const startSearch = async (sq, findMore = false) => {
    if (!sq) return;
    setLoading(true); setResult(null); setJob(null); setLastQuery(sq);
    try {
      localStorage.setItem('search_last_query', sq);
      localStorage.removeItem('search_last_result');
    } catch (e) {}
    try {
      const r = await api.post('/search', { query: sq, filter_mode: filterMode, density: density, find_more: findMore });
      if (r.job_id) {
        setJob({ status: 'running', progress: 0, log: [findMore ? 'Widening the search…' : 'Starting search…'], step: 'Discover' });
        setJobId(r.job_id);
      } else {
        setLoading(false);
        showToast(r.error || 'Could not start search', 'error');
      }
    } catch (e) { setLoading(false); showToast('Search failed: ' + e.message, 'error'); }
  };

  const runSearch = (q) => startSearch(q || query, false);
  const findMore = () => startSearch(lastQuery || query, true);

  const clearHistory = () => {
    setHistory([]);
    try { localStorage.removeItem('search_history'); } catch (e) {}
  };

  // Download just THIS search's results as a separate CSV
  const downloadResultCSV = (res) => {
    const r = res || result;
    const leads = (r && r.leads) || [];
    if (!leads.length) { showToast('No leads in this search to download', 'error'); return; }
    const fields = ['business_name', 'niche', 'city', 'country', 'phone', 'website', 'has_website', 'address', 'source'];
    const country = (r.parsed && r.parsed.country) || '';
    const esc = (v) => {
      const s = (v === null || v === undefined ? '' : v).toString().replace(/"/g, '""');
      return /[",\n]/.test(s) ? '"' + s + '"' : s;
    };
    const rows = leads.map(l => fields.map(f => esc(f === 'country' ? (l.country || country) : l[f])).join(','));
    const csv = [fields.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const label = ((r.parsed && r.parsed.niche || 'leads') + '_' + (r.parsed && r.parsed.city || ''))
      .replace(/[^a-z0-9]+/gi, '_').toLowerCase().replace(/^_+|_+$/g, '');
    a.href = url; a.download = 'search_' + label + '_' + Date.now() + '.csv'; a.click();
    URL.revokeObjectURL(url);
    const more = (r.total_new_leads || leads.length) > leads.length
      ? ' (first ' + leads.length + ' of ' + r.total_new_leads + ')' : '';
    showToast('Downloaded ' + leads.length + ' leads' + more, 'success');
  };

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Find Leads</h1>
        <p className="text-sm text-slate-500 mt-1">Search any business type in any city worldwide</p>
      </div>

      <Card className="bg-gradient-to-br from-accent-50 to-amber-50 dark:from-accent-900/20 dark:to-amber-900/20 border-accent-200 dark:border-accent-900/40">
        <div className="flex gap-2">
          <Input value={query} onChange={setQuery}
            placeholder='Try: "restaurants in Lahore Pakistan" or "barber shops in Miami"'
            icon="Search" className="flex-1"
            onKeyDown={(e) => e.key === 'Enter' && runSearch()} />
          <Button onClick={() => runSearch()} disabled={loading || !query} icon={loading ? null : 'Sparkles'} size="lg">
            {loading ? <Spinner /> : 'Search'}
          </Button>
        </div>

        {/* Filter Controls */}
        <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label className="text-xs text-slate-500 mb-1 block font-medium uppercase tracking-wide">Website Filter</label>
            <div className="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
              {[
                { id: 'no_website', label: 'No Website', desc: 'Best for pitch' },
                { id: 'all',        label: 'All',        desc: 'Both' },
                { id: 'with_website', label: 'Has Website', desc: 'Has site' },
              ].map(opt => (
                <button key={opt.id} onClick={() => setFilterMode(opt.id)}
                  title={opt.desc}
                  className={'px-3 py-1.5 rounded text-xs font-medium transition-colors ' + (
                    filterMode === opt.id ? 'bg-white dark:bg-slate-900 text-accent-600 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100'
                  )}>
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block font-medium uppercase tracking-wide">Coverage Density</label>
            <div className="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
              {[
                { id: 'low',      label: 'Fast',     desc: 'City-wide, quick' },
                { id: 'standard', label: 'Standard', desc: 'City + 1 ring' },
                { id: 'high',     label: 'Thorough', desc: 'Multi-ring + OpenStreetMap' },
              ].map(opt => (
                <button key={opt.id} onClick={() => setDensity(opt.id)}
                  title={opt.desc}
                  className={'px-3 py-1.5 rounded text-xs font-medium transition-colors ' + (
                    density === opt.id ? 'bg-white dark:bg-slate-900 text-accent-600 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100'
                  )}>
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
        </div>
        <div className="mt-4">
          <p className="text-xs text-slate-500 mb-2 font-medium uppercase tracking-wide">Quick Examples</p>
          <div className="flex flex-wrap gap-2">
            {examples.map(ex => (
              <button key={ex.q} onClick={() => { setQuery(ex.q); runSearch(ex.q); }}
                className="text-xs px-3 py-1.5 rounded-full bg-white/80 dark:bg-slate-900/80 hover:bg-accent-100 dark:hover:bg-accent-900/30 hover:text-accent-700 dark:hover:text-accent-400 transition-colors border border-slate-200 dark:border-slate-700">
                <span className="mr-1">{ex.emoji}</span>{ex.q}
              </button>
            ))}
          </div>
        </div>
      </Card>

      {job && (loading || job.status === 'running') && (
        <Card className="fade-in border-2 border-amber-300 dark:border-amber-700/50 bg-amber-50/50 dark:bg-amber-900/10">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">

              <span className="font-semibold text-sm">Searching leads across all sources…</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-sm font-mono text-amber-700 dark:text-amber-400">{job.progress || 0}%</span>
              <button onClick={async () => {
                if (!jobId) return;
                try { await api.post('/job/' + jobId + '/cancel', {}); } catch(e) {}
                setJob(j => ({ ...j, status: 'cancelled' }));
                setJobId(null);
              }} className="px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg text-xs font-semibold hover:bg-red-200 dark:hover:bg-red-900/60 transition-colors border border-red-200 dark:border-red-800">
                ✕ Stop

            </div>
          </div>
          <div className="w-full bg-amber-100 dark:bg-amber-900/30 rounded-full h-2 overflow-hidden mb-3">

  const [sortDir, setSortDir] = useState('desc');
  const [openLead, setOpenLead] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [advancedFilters, setAdvancedFilters] = useState({ city: '', country: '', niche: '', status: '' });
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [pageNum, setPageNum] = useState(1);
  const [pageSize, setPageSize] = useState(50);
  const [verifyJobId, setVerifyJobId] = useState(null);
  const [verifyJob, setVerifyJob] = useState(null);
  const { showToast } = useToast();

  // Poll website verification job
  useEffect(() => {
    if (!verifyJobId) return;
    let handled = false; // one-shot guard prevents duplicate toasts
    const poll = setInterval(async () => {
      try {
        const j = await api.get('/job/' + verifyJobId);
        setVerifyJob(j);
        if (!handled && j.status === 'completed') {
          handled = true;
          clearInterval(poll); setVerifyJobId(null);
          const res = j.results || {};
          showToast(`Verified! ${res.no_website || 0} leads confirmed NO website (hot leads), ${res.has_website || 0} have websites.`, 'success');
          refresh();
        } else if (!handled && j.status === 'failed') {
          handled = true;
          clearInterval(poll); setVerifyJobId(null);
          showToast('Verification failed: ' + (j.error || 'unknown error'), 'error');
        } else if (!handled && j.status === 'cancelled') {
          handled = true;
          clearInterval(poll); setVerifyJobId(null);
          showToast('Verification cancelled', 'info');
          refresh();
        }
      } catch (e) { /* transient */ }
    }, 2000);
    return () => clearInterval(poll);
  }, [verifyJobId]);

  const startVerify = async (selectedOnly = false) => {
    try {
      const lead_ids = selectedOnly ? [...selected] : [];
      const r = await api.post('/verify-websites', { lead_ids });
      if (r.job_id) {
        setVerifyJob({ status: 'running', progress: 0, log: ['Starting website verification…'], step: 'Verify Websites' });
        setVerifyJobId(r.job_id);
        showToast('Website verification started' + (lead_ids.length ? ` for ${lead_ids.length} leads` : ' for all unverified leads'), 'success');
      } else {
        showToast(r.error || 'Could not start verification', 'error');
      }
    } catch (e) { showToast('Failed to start verification: ' + e.message, 'error'); }
  };

  // Reset to page 1 whenever the filtered set changes
  useEffect(() => { setPageNum(1); }, [filter, search, advancedFilters, pageSize]);

  const refresh = () => {
    setLoading(true);
    api.get('/leads').then(d => { setLeads(d.leads || []); setLoading(false); }).catch(() => setLoading(false));
  };
  useEffect(refresh, []);

  // Unique values for filter dropdowns
  const uniqueValues = useMemo(() => {
    const cities = new Set(), countries = new Set(), niches = new Set(), statuses = new Set();
    leads.forEach(l => {
      if (l.city) cities.add(l.city);
      if (l.country) countries.add(l.country);
      if (l.niche) niches.add(l.niche);
      if (l.status) statuses.add(l.status);
    });
    return {
      cities: [...cities].sort(),
      countries: [...countries].sort(),
      niches: [...niches].sort(),
      statuses: [...statuses].sort()
    };
  }, [leads]);

  const filtered = useMemo(() => {
    let r = leads;
    if (filter === 'hot') r = r.filter(l => (l.lead_type || '').indexOf('HOT') !== -1);
    else if (filter === 'no_website_verified') r = r.filter(l => l.website_verified === true && !l.has_website);
    else if (filter === 'enriched') r = r.filter(l => !['discovered', 'rejected'].includes(l.status));
    else if (filter === 'with_email') r = r.filter(l => l.owner_email);
    else if (filter === 'verified_email') r = r.filter(l => l.email_status === 'deliverable');
    else if (filter === 'bad_email') r = r.filter(l => l.email_status === 'undeliverable');
    else if (filter === 'with_linkedin') r = r.filter(l => l.linkedin_url);
    else if (filter === 'with_contact') r = r.filter(l => l.owner_email || l.linkedin_url);
    else if (filter === 'scored') r = r.filter(l => parseInt(l.ai_score) >= 7);
    if (search) {
      const q = search.toLowerCase();
      r = r.filter(l => (l.business_name || '').toLowerCase().includes(q) ||
                       (l.city || '').toLowerCase().includes(q) ||
                       (l.country || '').toLowerCase().includes(q) ||
                       (l.niche || '').toLowerCase().includes(q) ||
                       (l.phone || '').includes(q) ||
                       (l.owner_email || '').toLowerCase().includes(q));
    }
    if (advancedFilters.city) r = r.filter(l => l.city === advancedFilters.city);
    if (advancedFilters.country) r = r.filter(l => l.country === advancedFilters.country);
    if (advancedFilters.niche) r = r.filter(l => l.niche === advancedFilters.niche);
    if (advancedFilters.status) r = r.filter(l => l.status === advancedFilters.status);
    if (sortBy) {
      r = [...r].sort((a, b) => {
        let av = a[sortBy], bv = b[sortBy];
        if (sortBy === 'ai_score') { av = parseInt(av) || 0; bv = parseInt(bv) || 0; }
        else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }
    return r;
  }, [leads, filter, search, sortBy, sortDir, advancedFilters]);

  const toggleSelect = (id) => {
    setSelected(s => {
      const next = new Set(s);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  // Page slice + counts derived from filtered + pageNum + pageSize
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.min(pageNum, totalPages);
  const pageStart = (safePage - 1) * pageSize;
  const pageEnd = Math.min(pageStart + pageSize, filtered.length);
  const pageItems = filtered.slice(pageStart, pageEnd);

  const selectAll = () => {
    setSelected(new Set(pageItems.map(l => l.id)));
  };

  const deselectAll = () => setSelected(new Set());

  const downloadSelectedCSV = () => {
    const ids = [...selected];
    const rows = leads.filter(l => ids.includes(l.id));
    if (rows.length === 0) {
      showToast('Select some leads first', 'error');
      return;
    }
    const fields = ['business_name', 'niche', 'city', 'country', 'phone', 'owner_email',
                   'owner_name', 'linkedin_url', 'address', 'ai_score', 'status'];
    const csv = [
      fields.join(','),
      ...rows.map(r => fields.map(f => {
        const v = (r[f] || '').toString().replace(/"/g, '""');
        return v.indexOf(',') >= 0 || v.indexOf('\n') >= 0 ? '"' + v + '"' : v;
      }).join(','))
    ].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leads_selected_' + Date.now() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded ' + rows.length + ' leads');
  };

  const downloadAllCSV = () => {
    let t = null; try { t = localStorage.getItem('auth_token'); } catch (e) {}
    window.location.href = '/leads.csv' + (t ? '?token=' + encodeURIComponent(t) : '');
  };

  const deleteSelected = async () => {
    const ids = [...selected];
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} selected lead${ids.length > 1 ? 's' : ''}? This cannot be undone.`)) return;
    try {
      const r = await api.post('/leads/delete', { lead_ids: ids });
      showToast(`Deleted ${r.deleted} lead${r.deleted === 1 ? '' : 's'}`, 'success');
      setSelected(new Set());
      refresh();
    } catch (e) { showToast('Delete failed: ' + e.message, 'error'); }
  };

  const clearFilters = () => {
    setSearch(''); setFilter('all'); setAdvancedFilters({city:'', country:'', niche:'', status:''});
  };

  return (
    <div className="space-y-4 fade-in">
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold">Leads</h1>
          <p className="text-sm text-slate-500 mt-1">
            {filtered.length} of {leads.length} leads
            {selected.size > 0 && <span className="ml-2 text-accent-600 font-semibold">• {selected.size} selected</span>}
          </p>
        </div>
        <div className="flex gap-2 flex-wrap">
          {selected.size > 0 && (
            <>
              <Button variant="success" onClick={downloadSelectedCSV} icon="Download">
                Download Selected ({selected.size})
              </Button>
              <Button variant="danger" onClick={deleteSelected} icon="Trash2">
                Delete Selected ({selected.size})
              </Button>
              <Button variant="ghost" onClick={deselectAll} icon="X">Clear</Button>
            </>
          )}
          <Button variant="secondary" onClick={refresh} icon="RefreshCw">Refresh</Button>
          {selected.size > 0
            ? <Button variant="secondary" onClick={() => startVerify(true)} icon="Globe" disabled={!!verifyJobId}>Verify Selected</Button>
            : <Button variant="secondary" onClick={() => startVerify(false)} icon="Globe" disabled={!!verifyJobId}>Verify Websites</Button>
          }
          <Button variant="secondary" onClick={downloadAllCSV} icon="Download">All CSV</Button>
        </div>
      </div>

      {/* Website verification progress panel */}
      {verifyJob && verifyJob.status === 'running' && (
        <div className="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl p-4 fade-in">
          <div className="flex items-center justify-between mb-2">
            <span className="font-semibold text-amber-900 dark:text-amber-100 text-sm flex items-center gap-2">
              <span className="inline-block w-3 h-3 rounded-full bg-amber-500 spin" />
              Analyzing websites… {verifyJob.progress || 0}%
            </span>
            <button onClick={async () => {
              if (!verifyJobId) return;
              try { await api.post('/job/' + verifyJobId + '/cancel', {}); } catch (e) {}
              setVerifyJob(j => ({ ...j, status: 'cancelled' }));
              setVerifyJobId(null);
            }} className="px-3 py-1 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs font-medium hover:bg-red-200 transition-colors">
              ✕ Stop
            </button>
          </div>
          <div className="w-full bg-amber-200 dark:bg-amber-800 rounded-full h-1.5 mb-2">
            <div className="bg-amber-500 h-1.5 rounded-full transition-all" style={{ width: (verifyJob.progress || 0) + '%' }} />
          </div>
          {verifyJob.log && verifyJob.log.length > 0 && (
            <p className="text-xs text-amber-800 dark:text-amber-200 font-mono">
              {verifyJob.log[verifyJob.log.length - 1]}
            </p>
          )}
        </div>
      )}

      {/* Quick filter chips */}
      <Card>
        <div className="flex flex-col gap-3">
          <div className="flex gap-2 flex-wrap items-center">
            <Input value={search} onChange={setSearch} placeholder="Search across all fields..." icon="Search" className="flex-1 min-w-[240px]" />
            <button onClick={() => setShowAdvanced(!showAdvanced)}
              className={'px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 ' + (
                showAdvanced ? 'bg-accent-600 text-white' : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700'
              )}>
              <Icon name="ListFilter" /> Filters
            </button>
          </div>

          {showAdvanced && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg fade-in">
              <select value={advancedFilters.country} onChange={e => setAdvancedFilters({...advancedFilters, country: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Countries</option>
                {uniqueValues.countries.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={advancedFilters.city} onChange={e => setAdvancedFilters({...advancedFilters, city: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Cities</option>
                {uniqueValues.cities.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={advancedFilters.niche} onChange={e => setAdvancedFilters({...advancedFilters, niche: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Niches</option>
                {uniqueValues.niches.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={advancedFilters.status} onChange={e => setAdvancedFilters({...advancedFilters, status: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Statuses</option>
                {uniqueValues.statuses.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div className="col-span-2 md:col-span-4 flex justify-end">
                <Button variant="ghost" size="sm" onClick={clearFilters}>Clear Filters</Button>
              </div>
            </div>
          )}

          <div className="flex items-center justify-between gap-2 flex-wrap">
            <div className="flex gap-2 flex-wrap">
              {[
                { id: 'all',                 label: 'All',                  count: leads.length },
                { id: 'hot',                 label: 'Hot (no website)',      count: leads.filter(l => (l.lead_type || '').indexOf('HOT') !== -1).length },
                { id: 'no_website_verified', label: '✓ No Website (verified)', count: leads.filter(l => l.website_verified === true && !l.has_website).length },
                { id: 'enriched',            label: 'Enriched',             count: leads.filter(l => !['discovered', 'rejected'].includes(l.status)).length },
                { id: 'with_email',          label: 'Has Email',            count: leads.filter(l => l.owner_email).length },
                { id: 'verified_email',      label: '✓ Verified Email',      count: leads.filter(l => l.email_status === 'deliverable').length },
                { id: 'bad_email',           label: '✗ Undeliverable',       count: leads.filter(l => l.email_status === 'undeliverable').length },
                { id: 'with_linkedin',       label: 'Has LinkedIn',         count: leads.filter(l => l.linkedin_url).length },
                { id: 'with_contact',        label: 'Has Email or LinkedIn', count: leads.filter(l => l.owner_email || l.linkedin_url).length },
                { id: 'scored',              label: 'High Score (7+)',      count: leads.filter(l => parseInt(l.ai_score) >= 7).length },
              ].map(f => (
                <button key={f.id} onClick={() => setFilter(f.id)}
                  className={'px-3 py-1.5 rounded-full text-xs font-medium transition-colors ' + (
                    filter === f.id ? 'bg-accent-600 text-white' : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700'
                  )}>
                  {f.label} <span className="ml-1 opacity-60">{f.count}</span>
                </button>
              ))}
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <span className="text-xs text-slate-500 whitespace-nowrap">Sort by</span>
              <select value={sortBy + '|' + sortDir}
                onChange={e => { const [k, d] = e.target.value.split('|'); setSortBy(k); setSortDir(d); }}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-medium">
                <option value="date_found|desc">Newest First</option>
                <option value="date_found|asc">Oldest First</option>
                <option value="ai_score|desc">Highest Score</option>
                <option value="business_name|asc">Name A → Z</option>
                <option value="business_name|desc">Name Z → A</option>
                <option value="city|asc">City A → Z</option>
                <option value="niche|asc">Niche A → Z</option>
              </select>
            </div>
          </div>
        </div>
      </Card>

      <Card noPad>
        {loading ? (
          <div className="py-16 text-center"><Spinner size="w-6 h-6" /></div>
        ) : filtered.length === 0 ? (
          <div className="py-16 text-center text-slate-500">
            <Icon name="Search" className="w-12 h-12 mx-auto mb-3 opacity-30" />
            <p>No leads match your filters</p>
            <Button variant="ghost" size="sm" onClick={clearFilters} className="mt-3">Clear Filters</Button>
          </div>
        ) : (
          <div className="overflow-x-auto scrollbar-thin">
            <table className="w-full text-sm table-fixed min-w-[960px]">
              <thead className="bg-slate-50 dark:bg-slate-800/50 sticky top-0">
                <tr className="border-b border-slate-200 dark:border-slate-800">
                  <th className="py-3 px-3 w-10">
                    <input type="checkbox" className="w-4 h-4 rounded"
                      checked={pageItems.length > 0 && pageItems.every(l => selected.has(l.id))}
                      onChange={() => pageItems.every(l => selected.has(l.id)) ? deselectAll() : selectAll()} />
                  </th>
                  {[
                    { key: 'business_name', label: 'Business', align: 'left',   w: 'w-[150px]' },
                    { key: 'niche',         label: 'Niche',    align: 'left',   w: 'w-[90px]'  },
                    { key: 'city',          label: 'City',     align: 'left',   w: 'w-[90px]'  },
                    { key: 'country',       label: 'Country',  align: 'left',   w: 'w-[70px]'  },
                    { key: 'phone',         label: 'Phone',    align: 'left',   w: 'w-[110px]' },
                    { key: 'owner_email',   label: 'Email',    align: 'left',   w: 'w-[170px]' },
                    { key: 'linkedin_url',  label: 'LinkedIn', align: 'center', w: 'w-[80px]'  },
                    { key: 'ai_score',      label: 'Score',    align: 'center', w: 'w-[75px]'  },
                    { key: 'status',        label: 'Status',   align: 'center', w: 'w-[120px]' },
                    { key: 'date_found',    label: 'Discovered', align: 'left', w: 'w-[130px]' },
                  ].map(col => (
                    <th key={col.key} onClick={() => {
                      if (sortBy === col.key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
                      else { setSortBy(col.key); setSortDir(['date_found','date_updated','ai_score'].includes(col.key) ? 'desc' : 'asc'); }
                    }}
                      className={'py-3 px-3 font-semibold text-xs uppercase tracking-wide text-slate-500 cursor-pointer hover:text-slate-900 dark:hover:text-slate-100 select-none whitespace-nowrap text-' + col.align + ' ' + col.w}>
                      <div className={'flex items-center gap-1 ' + (col.align === 'center' ? 'justify-center' : '')}>
                        {col.label}
                        {sortBy === col.key && <span className="text-accent-600 font-bold">{sortDir === 'asc' ? '↑' : '↓'}</span>}
                      </div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {pageItems.map((l, i) => {
                  const isSelected = selected.has(l.id);
                  return (
                    <tr key={l.id || i}
                      className={'border-b border-slate-100 dark:border-slate-800 transition-colors ' + (
                        isSelected ? 'bg-accent-50 dark:bg-accent-900/20' : 'hover:bg-slate-50 dark:hover:bg-slate-800/50'
                      )}>
                      <td className="py-3 px-3" onClick={e => e.stopPropagation()}>
                        <input type="checkbox" className="w-4 h-4 rounded cursor-pointer"
                          checked={isSelected}
                          onChange={() => toggleSelect(l.id)} />
                      </td>
                      <td className="py-3 px-3 font-medium cursor-pointer" onClick={() => setOpenLead(l.id)}>
                        <div className="flex items-center gap-2 min-w-0">
                          <span className="truncate">{l.business_name}</span>
                          {l.mockup_url && <span className="text-accent-500 text-xs flex-shrink-0" title="Has mockup">🎨</span>}
                          {l.website
                            ? <a href={l.website} target="_blank" onClick={e => e.stopPropagation()} title={l.website} className="text-green-600 text-xs hover:underline flex-shrink-0">🌐</a>
                            : null}
                          {l.website_verified === true && !l.has_website && (
                            <span className="flex-shrink-0 text-xs font-bold text-red-500" title="Verified: No website — hot lead!">NO SITE</span>
                          )}
                          {l.website_verified === true && l.has_website && (
                            <span className="flex-shrink-0 text-xs text-green-600" title="Verified: Has a live website">✓</span>
                          )}
                          {!l.website_verified && (
                            <span className="flex-shrink-0 text-xs text-slate-300 dark:text-slate-600" title="Website not yet verified">?</span>
                          )}
                        </div>
                        {l.date_found && <div className="text-xs text-slate-400 mt-0.5">{l.date_found}</div>}
                      </td>
                      <td className="py-3 px-3 text-slate-600 dark:text-slate-400 capitalize cursor-pointer truncate" onClick={() => setOpenLead(l.id)}>{l.niche}</td>
                      <td className="py-3 px-3 text-slate-600 dark:text-slate-400 cursor-pointer truncate" onClick={() => setOpenLead(l.id)}>{l.city}</td>
                      <td className="py-3 px-3 text-slate-600 dark:text-slate-400 font-mono text-xs cursor-pointer" onClick={() => setOpenLead(l.id)}>{l.country}</td>
                      <td className="py-3 px-3 font-mono text-xs text-cyan-600 cursor-pointer" onClick={() => setOpenLead(l.id)}>{l.phone || '—'}</td>
                      <td className="py-3 px-3 text-xs max-w-0">{l.owner_email ? (
                      <span className="flex items-center gap-1 min-w-0">
                        {l.email_status === 'deliverable' && <span className="text-green-600 flex-shrink-0" title="Verified deliverable (SMTP-checked)">✓</span>}
                        {l.email_status === 'risky' && <span className="text-amber-500 flex-shrink-0" title="Risky — catch-all domain or role account">⚠</span>}
                        {l.email_status === 'undeliverable' && <span className="text-red-500 flex-shrink-0" title="Undeliverable — sending is blocked">✗</span>}
                        {(!l.email_status || l.email_status === 'unknown') && <span className="text-slate-400 flex-shrink-0" title="Not verified yet — run Verify Emails on the Pipeline page">?</span>}
                        <a href={'mailto:' + l.owner_email} onClick={e => e.stopPropagation()} className="text-accent-600 hover:underline block truncate" title={l.owner_email}>{l.owner_email}</a>
                      </span>
                    ) : '—'}</td>
                      <td className="py-3 px-3 text-center">
                        {l.linkedin_url ? (
                          <a href={l.linkedin_url} target="_blank" onClick={e => e.stopPropagation()}
                            className="inline-flex items-center justify-center w-8 h-8 rounded bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-200 dark:hover:bg-blue-900/60 transition-colors font-bold text-xs"
                            title={l.linkedin_url}>
                            in
                          </a>
                        ) : <span className="text-slate-400">—</span>}
                      </td>
                      <td className="py-3 px-3 text-center cursor-pointer" onClick={() => setOpenLead(l.id)}>
                        {l.ai_score ? <Badge variant={parseInt(l.ai_score) >= 8 ? 'success' : parseInt(l.ai_score) >= 5 ? 'info' : 'default'}>{l.ai_score}/10</Badge> : '—'}
                      </td>
                      <td className="py-3 px-3 text-center cursor-pointer" onClick={() => setOpenLead(l.id)}>
                        <Badge variant={l.status === 'ready' ? 'success' : l.status === 'sent' ? 'purple' : l.status === 'enriched' ? 'info' : 'default'}>{l.status}</Badge>
                      </td>
                      <td className="py-3 px-3 cursor-pointer" onClick={() => setOpenLead(l.id)}>
                        <div className="text-xs text-slate-500 font-mono whitespace-nowrap">{l.date_found || '—'}</div>

                          <div className="text-xs text-accent-500 dark:text-accent-400 font-mono whitespace-nowrap" title="Last updated">{l.date_updated}</div>

                      </td>

                })}
              </tbody>
            </table>
            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 py-3 px-4 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500">
              <div>
                {filtered.length === 0
                  ? 'No leads match'
                  : <>Showing <span className="font-semibold text-slate-700 dark:text-slate-300">{pageStart + 1}-{pageEnd}</span> of <span className="font-semibold text-slate-700 dark:text-slate-300">{filtered.length}</span></>}
              </div>
              <div className="flex items-center gap-2">
                <label className="flex items-center gap-1">
                  <span>Per page:</span>
                  <select value={pageSize} onChange={e => setPageSize(parseInt(e.target.value, 10))}
                    className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-2 py-1">
                    <option value={25}>25</option>
                    <option value={50}>50</option>
                    <option value={100}>100</option>
                    <option value={200}>200</option>
                    <option value={filtered.length || 1}>All</option>
                  </select>
                </label>
                <button
                  onClick={() => setPageNum(Math.max(1, safePage - 1))}
                  disabled={safePage <= 1}
                  className="px-3 py-1 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">
                  Prev
                </button>
                <span className="px-2 font-medium text-slate-700 dark:text-slate-300">
                  Page {safePage} / {totalPages}
                </span>
                <button
                  onClick={() => setPageNum(Math.min(totalPages, safePage + 1))}
                  disabled={safePage >= totalPages}
                  className="px-3 py-1 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">
                  Next
                </button>
              </div>
            </div>
          </div>
        )}
      </Card>

      {openLead && <LeadDetailModal leadId={openLead} onClose={() => setOpenLead(null)} onUpdate={refresh} />}
    </div>
  );
};

const PipelinePage = () => {
  const [provider, setProvider] = useState('free_first');
  const [reenrichProvider, setReenrichProvider] = useState('free_first');
  const [includeImages, setIncludeImages] = useState(false);
  const [jobId, setJobId] = useState(null);
  const [job, setJob] = useState(null);
  const [stepLabel, setStepLabel] = useState('');
  const [pStats, setPStats] = useState(null);
  const { showToast } = useToast();

  // Quick Enrich state
  const [qeMode, setQeMode] = useState('single'); // 'single' | 'csv'
  const [qeCompany, setQeCompany] = useState('');
  const [qeCity, setQeCity] = useState('');
  const [qeNiche, setQeNiche] = useState('');
  const [qeStrategy, setQeStrategy] = useState('free_first');
  const [qeLoading, setQeLoading] = useState(false);
  const [qeResult, setQeResult] = useState(null);
  const [qeCsvText, setQeCsvText] = useState('');
  const [qeCsvJobId, setQeCsvJobId] = useState(null);
  const [qeCsvJob, setQeCsvJob] = useState(null);

  const loadStats = () => api.get('/stats').then(s => setPStats(s)).catch(() => {});
  useEffect(() => { loadStats(); }, []);

  const startPolling = (id, label) => {
    setJobId(id);
    setStepLabel(label || '');
    setJob(null);
  };

  const run = async () => {
    try {
      const r = await api.post('/run-pipeline', { provider, generate_images: includeImages });
      startPolling(r.job_id, 'Full Pipeline');
      showToast('Pipeline started', 'info');
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
  };

  const enrichSingle = async () => {
    if (!qeCompany.trim()) { showToast('Enter a company name', 'error'); return; }
    setQeLoading(true); setQeResult(null);
    try {
      const r = await api.post('/enrich-company', {
        company_name: qeCompany.trim(), city: qeCity.trim(),
        niche: qeNiche.trim(), strategy: qeStrategy,
      });
      setQeResult(r);
      showToast(r.contact_found ? 'Contact found!' : 'No contact found', r.contact_found ? 'success' : 'warning');
      loadStats();
    } catch (e) { showToast('Error: ' + e.message, 'error'); }
    setQeLoading(false);
  };

  const enrichCsv = async () => {
    if (!qeCsvText.trim()) { showToast('Paste CSV data first', 'error'); return; }
    try {
      const r = await api.post('/enrich-csv', { csv_text: qeCsvText.trim(), strategy: qeStrategy });
      setQeCsvJobId(r.job_id);
      setQeCsvJob(null);
      showToast(`CSV enrichment started — ${r.total} companies`, 'info');
    } catch (e) { showToast('Error: ' + e.message, 'error'); }
  };

  useEffect(() => {
    if (!qeCsvJobId) return;
    const poll = setInterval(async () => {
      try {
        const j = await api.get('/job/' + qeCsvJobId);
        setQeCsvJob(j);
        if (j.status === 'completed' || j.status === 'failed') {
          clearInterval(poll);
          loadStats();
          if (j.status === 'completed') showToast(`CSV done: ${j.results?.contact_found || 0} contacts found`, 'success');
        }
      } catch(e) { clearInterval(poll); }
    }, 2000);
    return () => clearInterval(poll);
  }, [qeCsvJobId]);

  useEffect(() => {
    if (!jobId) return;
    const poll = setInterval(async () => {
      try {
        const j = await api.get('/job/' + jobId);
        setJob(j);
        if (j.status === 'completed') {
          clearInterval(poll);
          loadStats();
          const count = j.results ? (j.results.processed ?? j.results.total ?? j.results.enriched ?? '') : '';
          showToast(`${stepLabel || 'Job'} completed${count !== '' ? ': ' + count + ' processed' : ''}`, 'success');
        } else if (j.status === 'failed') {
          clearInterval(poll);
          showToast(`${stepLabel || 'Job'} failed: ${j.error || 'unknown error'}`, 'error');
        }
      } catch (e) { clearInterval(poll); }
    }, 2000);
    return () => clearInterval(poll);
  }, [jobId]);

  const runStep = async (path, label, extraBody = {}) => {
    try {
      showToast('Starting: ' + label, 'info');
      const r = await api.post(path, extraBody);
      if (r.job_id) {
        startPolling(r.job_id, label);
      } else {
        showToast(label + ' done: ' + (r.total ?? (r.results || []).length) + ' items', 'success');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
  };

  return (
    <div className="space-y-6 fade-in max-w-3xl">
      <div>
        <h1 className="text-2xl font-bold">Pipeline</h1>
        <p className="text-sm text-slate-500 mt-1">Enrich, score, prepare for outreach</p>
      </div>

      {/* Pipeline status overview */}
      {pStats && (
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
          {[
            { label: 'Total Leads', value: pStats.total, color: 'slate' },
            { label: 'Need Enriching', value: pStats.discovered, color: 'amber', hint: 'Click Enrich All →' },
            { label: 'Enriched', value: pStats.enriched, color: 'accent' },
            { label: 'No Contact Found', value: pStats.enriched_no_contact, color: 'orange', hint: 'Re-Enrich below ↓' },
            { label: 'Scored', value: pStats.scored, color: 'fuchsia' },
            { label: 'Ready to Send', value: pStats.ready, color: 'green' },
          ].map(s => (
            <div key={s.label} className={`p-3 rounded-xl border-2 text-center ${
              s.color === 'amber'  && s.value > 0 ? 'border-amber-400 bg-amber-50 dark:bg-amber-900/20' :
              s.color === 'orange' && s.value > 0 ? 'border-orange-400 bg-orange-50 dark:bg-orange-900/20' :
              s.color === 'green'  ? 'border-green-200 bg-green-50 dark:bg-green-900/10' :
              s.color === 'accent' ? 'border-accent-200 bg-accent-50 dark:bg-accent-900/10' :
              s.color === 'fuchsia'? 'border-fuchsia-200 bg-fuchsia-50 dark:bg-fuchsia-900/10' :
              'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800'
            }`}>
              <div className={`text-2xl font-bold ${
                s.color === 'amber'  && s.value > 0 ? 'text-amber-600' :
                s.color === 'orange' && s.value > 0 ? 'text-orange-600' :
                s.color === 'green'  ? 'text-green-600' :
                s.color === 'accent' ? 'text-accent-600' :
                s.color === 'fuchsia'? 'text-fuchsia-600' :
                'text-slate-700 dark:text-slate-200'
              }`}>{s.value ?? '—'}</div>
              <div className="text-xs text-slate-500 mt-0.5">{s.label}</div>
              {s.hint && s.value > 0 && <div className="text-xs text-orange-500 mt-0.5">{s.hint}</div>}
            </div>
          ))}
        </div>
      )}

      {/* Job status panel — always visible when any job is running */}
      {job && (
        <div className={`rounded-xl border-2 p-4 space-y-3 ${
          job.status === 'completed' ? 'border-green-400 bg-green-50 dark:bg-green-900/20' :
          job.status === 'failed'    ? 'border-red-400 bg-red-50 dark:bg-red-900/20' :

const CompetitorPage = () => {
  const [target, setTarget] = useState('');
  const [mode, setMode] = useState('intel');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const { showToast } = useToast();

  const run = async () => {
    if (!target) return;
    setLoading(true); setResult(null);
    try {
      const cleanDomain = target.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      const url = target.indexOf('http') === 0 ? target : 'https://' + cleanDomain;
      const m = {
        intel:     ['/competitor', { target }],
        wayback:   ['/wayback', { url }],
        tech:      ['/tech-stack', { domain: cleanDomain }],
        backlinks: ['/backlinks', { url }],
        domain:    ['/domain-intel', { domain: cleanDomain }],
      };
      const [ep, body] = m[mode];
      const r = await api.post(ep, body);
      setResult(r);
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    setLoading(false);
  };

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Competitor Intel</h1>
        <p className="text-sm text-slate-500 mt-1">Analyze any competitor</p>
      </div>
      <Card>
        <div className="flex gap-2 mb-4 border-b border-slate-200 dark:border-slate-800 -mx-5 px-5 overflow-x-auto scrollbar-thin">
          {[
            { id: 'intel', label: 'Full Intel', icon: 'Crosshair' },
            { id: 'tech', label: 'Tech Stack', icon: 'Cpu' },
            { id: 'domain', label: 'Domain', icon: 'Globe' },
            { id: 'wayback', label: 'Time Machine', icon: 'History' },
            { id: 'backlinks', label: 'Backlinks', icon: 'Link2' },

            <button key={t.id} onClick={() => { setMode(t.id); setResult(null); }}
              className={'px-3 py-2 text-sm font-medium border-b-2 -mb-px flex items-center gap-2 whitespace-nowrap ' + (
                mode === t.id ? 'border-accent-500 text-accent-600' : 'border-transparent text-slate-500'
              )}>
              <Icon name={t.icon} /> {t.label}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <Input value={target} onChange={setTarget} placeholder="Domain or company (e.g. shopify.com)" icon="Target" className="flex-1"
            onKeyDown={e => e.key === 'Enter' && run()} />
          <Button onClick={run} disabled={loading}>{loading ? <Spinner /> : 'Analyze'}</Button>
        </div>
      </Card>
      {result && (
        <Card className="fade-in">
          {mode === 'tech' && (
            <div>
              <h3 className="font-semibold mb-3">{result.title}</h3>
              <p className="text-sm text-slate-600 mb-4">{result.description}</p>
              <div className="flex flex-wrap gap-2">
                {(result.tech_stack || []).length === 0 ? <Badge>None detected</Badge> :
                  (result.tech_stack || []).map((t, i) => <Badge key={i} variant="purple">{t}</Badge>)}
              </div>
            </div>
          )}
          {mode === 'wayback' && (
            <div>
              <h3 className="font-semibold mb-3">Historical Snapshots</h3>
              <p className="text-sm mb-3">First: <strong>{result.first_snapshot?.date}</strong></p>
              <div className="space-y-2">
                {(result.snapshots || []).map((s, i) => (
                  <a key={i} href={s.snapshot_url} target="_blank" className="block p-3 bg-slate-50 dark:bg-slate-800 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                    <p className="font-medium text-sm">{s.date}</p>
                  </a>
                ))}
              </div>
            </div>
          )}
          {mode === 'backlinks' && (
            <div>
              <h3 className="font-semibold mb-3">Backlinks ({(result.backlinks || []).length})</h3>
              <div className="space-y-2">
                {(result.backlinks || []).map((b, i) => (
                  <a key={i} href={b.source_url} target="_blank" className="block p-3 bg-slate-50 dark:bg-slate-800 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                    <p className="font-medium text-sm">{b.title}</p>
                    <p className="text-xs text-accent-600 truncate">{b.source_url}</p>
                  </a>

              </div>
            </div>
          )}
          {mode === 'intel' && (
            <div className="space-y-4">
              <div>
                <h3 className="font-semibold mb-2">Social Presence</h3>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {Object.entries(result.social_presence || {}).map(([k, v]) => (

                <div className="flex flex-wrap gap-1">
                  {(result.tech_hints || []).map((t, i) => <Badge key={i} variant="purple">{t}</Badge>)}

          )}
        </Card>

const PeoplePage = () => {

  const [vals, setVals] = useState({});
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const { showToast } = useToast();

  const run = async () => {
    setLoading(true); setResult(null);
    try {
      let r;
      if (mode === 'people') {
        if (!vals.company) return showToast('Company required', 'error');
        r = await api.post('/find-people', { company_name: vals.company });
      } else if (mode === 'emails') {
        if (!vals.company && !vals.domain) return showToast('Company or domain required', 'error');
        r = await api.post('/find-emails', { business_name: vals.company || '', domain: vals.domain || '', first_name: vals.firstName || '', last_name: vals.lastName || '' });
      } else if (mode === 'verify') {
        if (!vals.email) return showToast('Email required', 'error');
        r = await api.post('/verify-email', { email: vals.email });
      }
      setResult(r);
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    setLoading(false);
  };

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">People & Email Finder</h1>
        <p className="text-sm text-slate-500 mt-1">Free Apollo + Hunter alternatives</p>
      </div>

          {[
            { id: 'people', label: 'Find People', icon: 'UserSearch' },
            { id: 'emails', label: 'Find Emails', icon: 'Mail' },
            { id: 'verify', label: 'Verify Email', icon: 'CheckCircle2' },

const EcommercePage = () => {
  const [mode, setMode]       = useState('hunter');   // 'hunter' | 'research'
  const [query, setQuery]     = useState('');
  const [country, setCountry] = useState('us');
  const [result, setResult]   = useState(null);
  const [loading, setLoading] = useState(false);
  const [step, setStep]       = useState('');
  const [activeTab, setActiveTab] = useState('products');
  // Product Hunter state
  const [hCategory, setHCategory] = useState('');
  const [hCount, setHCount]       = useState(6);
  const [hResult, setHResult]     = useState(null);
  const [hLoading, setHLoading]   = useState(false);
  const [hStep, setHStep]         = useState('');
  // History panel (both modes) — fixes results vanishing on tab navigation:
  // every run is saved server-side, and the most recent one auto-restores
  // on mount instead of showing an empty page.
  const [hHistory, setHHistory]     = useState([]);
  const [rHistory, setRHistory]     = useState([]);
  const [showHHistory, setShowHHistory] = useState(false);
  const [showRHistory, setShowRHistory] = useState(false);
  const [showLegend, setShowLegend] = useState(false);
  const [resumed, setResumed] = useState(false);
  const { showToast } = useToast();

  const loadHistoryList = (runType, setter) => {
    api.post('/research-history/list', { run_type: runType, limit: 20 })
      .then(r => setter(r.history || [])).catch(() => {});
  };

  useEffect(() => {
    loadHistoryList('product_hunt', setHHistory);
    loadHistoryList('ecommerce', setRHistory);
    // Auto-restore the most recent run of each type so navigating away and
    // back doesn't lose your last hunt/research — 0 credits, from history.
    api.post('/research-history/list', { run_type: 'product_hunt', limit: 1 }).then(r => {
      const last = (r.history || [])[0];
      if (last) api.get('/research-history/' + last.id).then(d => { setHResult(d); setResumed(true); }).catch(() => {});
    }).catch(() => {});
    api.post('/research-history/list', { run_type: 'ecommerce', limit: 1 }).then(r => {
      const last = (r.history || [])[0];
      if (last) api.get('/research-history/' + last.id).then(d => { setResult(d); setResumed(true); }).catch(() => {});
    }).catch(() => {});
  }, []);

  const openHistoryEntry = async (id, isHunt) => {
    try {
      const d = await api.get('/research-history/' + id);
      if (isHunt) { setHResult(d); setShowHHistory(false); }
      else { setResult(d); setActiveTab('products'); setShowRHistory(false); }
    } catch (e) { showToast('Could not load that entry', 'error'); }
  };

  const deleteHistoryEntry = async (id, runType, e) => {
    e.stopPropagation();
    try {
      await api.post('/research-history/' + id + '/delete', {});
      loadHistoryList(runType, runType === 'product_hunt' ? setHHistory : setRHistory);
    } catch (e) { showToast('Delete failed', 'error'); }
  };

  const timeAgo = (iso) => {
    const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  };

  const COUNTRIES = [
    { code: 'us', label: '🇺🇸 United States' },
    { code: 'uk', label: '🇬🇧 United Kingdom' },
    { code: 'au', label: '🇦🇺 Australia' },
    { code: 'ca', label: '🇨🇦 Canada' },
    { code: 'de', label: '🇩🇪 Germany' },
    { code: 'fr', label: '🇫🇷 France' },
    { code: 'it', label: '🇮🇹 Italy' },
    { code: 'es', label: '🇪🇸 Spain' },
  ];

  const run = async (qOverride, force) => {
    const q = (qOverride !== undefined ? qOverride : query).trim();
    if (!q) return;
    if (qOverride !== undefined) setQuery(qOverride);
    setLoading(true); setResult(null); setResumed(false);
    const steps = [
      'Searching Google Shopping...',
      'Scanning Amazon listings...',
      'Checking live eBay listings (official API)...',
      'Fetching eBay sold items (real sales data)...',
      'Counting active competition...',
      'Pulling Google Trends...',
      'Expanding keywords...',
      'Generating AI verdict...',
    ];
    let si = 0;
    setStep(steps[0]);
    const ticker = setInterval(() => {
      si = Math.min(si + 1, steps.length - 1);
      setStep(steps[si]);
    }, 3500);
    try {
      const r = await api.post('/ecommerce', { query: q, country, force: !!force });
      setResult(r);
      setActiveTab('products');
      loadHistoryList('ecommerce', setRHistory);
    } catch (e) {
      showToast('Research failed: ' + (e.message || 'unknown error'), 'error');
    }
    clearInterval(ticker);
    setLoading(false); setStep('');
  };

  const runHunt = async (force) => {
    if (!hCategory.trim()) return;
    setHLoading(true); setHResult(null); setResumed(false);
    const steps = [
      'Scanning Google Shopping best sellers...',
      'Reading best-seller reports...',
      'Pulling trend signals...',
      'Checking live eBay listings...',
      'AI hunter selecting candidates...',
      'Scoring demand · competition · margin · trend...',
      'Ranking the final list...',
    ];
    let si = 0;
    setHStep(steps[0]);
    const ticker = setInterval(() => {
      si = Math.min(si + 1, steps.length - 1);
      setHStep(steps[si]);
    }, 4500);
    try {
      const r = await api.post('/product-hunt', { category: hCategory.trim(), country, count: hCount, force: !!force });
      setHResult(r);
      loadHistoryList('product_hunt', setHHistory);
    } catch (e) {
      showToast('Hunt failed: ' + (e.message || 'unknown error'), 'error');
    }
    clearInterval(ticker);
    setHLoading(false); setHStep('');
  };

  const deepResearch = (name) => {
    setMode('research');
    run(name);
  };

  const sym = result ? result.symbol : '$';
  const fmt = (v) => v != null ? sym + Number(v).toLocaleString() : '—';
  const fmtN = (v) => v != null ? Number(v).toLocaleString() : '—';

  const competitionColor = (level) => {
    const m = { 'Low': 'text-green-600 bg-green-50 dark:bg-green-900/30', 'Medium': 'text-yellow-600 bg-yellow-50 dark:bg-yellow-900/30', 'High': 'text-orange-600 bg-orange-50 dark:bg-orange-900/30', 'Very High': 'text-red-600 bg-red-50 dark:bg-red-900/30' };
    return m[level] || 'text-slate-600 bg-slate-50';
  };

  const StarRating = ({ rating }) => {
    if (!rating) return null;
    const stars = Math.round(rating);
    return (
      <span className="text-yellow-400 text-xs">
        {'★'.repeat(stars)}{'☆'.repeat(5 - stars)}
        <span className="text-slate-500 ml-1">{Number(rating).toFixed(1)}</span>
      </span>
    );
  };

  const PriceBar = ({ pa }) => {
    if (!pa || !pa.min) return null;
    const range = pa.max - pa.min;
    if (!range) return null;
    const avgPct = ((pa.avg - pa.min) / range) * 100;
    const medPct = ((pa.median - pa.min) / range) * 100;
    return (
      <div className="mt-3">
        <div className="relative h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
          <div className="absolute inset-0 bg-gradient-to-r from-green-400 via-yellow-400 to-red-400 opacity-30 rounded-full" />
          <div className="absolute top-0 h-full w-0.5 bg-accent-600" style={{left: avgPct + '%'}} title={'Avg: ' + fmt(pa.avg)} />
          <div className="absolute top-0 h-full w-0.5 bg-amber-500" style={{left: medPct + '%'}} title={'Median: ' + fmt(pa.median)} />
        </div>
        <div className="flex justify-between text-xs text-slate-400 mt-1">
          <span>{fmt(pa.min)}</span>
          <span className="text-accent-600 font-medium">Avg {fmt(pa.avg)}</span>
          <span>{fmt(pa.max)}</span>
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-6 fade-in">
      {/* Header */}
      <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
          <h1 className="text-2xl font-bold flex items-center gap-2">
            <Icon name="ShoppingBag" size={24} /> Product Intelligence
          </h1>
          <p className="text-sm text-slate-500 mt-1">
            {mode === 'hunter'
              ? 'Give it a niche — the AI hunter finds & ranks the best products to sell on eBay/Amazon'
              : 'Real eBay data · Google Shopping · Amazon · Trends · AI verdict'}
          </p>
        </div>
        <div className="flex items-center gap-2 self-start">
          <div className="flex gap-1 bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
            {[
              { id: 'hunter',   label: 'Product Hunter', icon: 'Crosshair' },
              { id: 'research', label: 'Deep Research',  icon: 'Search' },
            ].map(m => (
              <button key={m.id} onClick={() => setMode(m.id)}
                className={'flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md transition-colors ' +
                  (mode === m.id ? 'bg-white dark:bg-slate-900 text-accent-600 shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white')}>
                <Icon name={m.icon} size={14} /> {m.label}
              </button>
            ))}
          </div>
          <Button size="sm" variant="secondary" icon="History"
            onClick={() => mode === 'hunter' ? setShowHHistory(v => !v) : setShowRHistory(v => !v)}>
            History
          </Button>
          <Button size="sm" variant="secondary" icon="HelpCircle" onClick={() => setShowLegend(true)}>
            How to read scores
          </Button>
        </div>
      </div>

      {/* History panel */}
      {((mode === 'hunter' && showHHistory) || (mode === 'research' && showRHistory)) && (
        <Card>
          <h3 className="font-semibold mb-3 flex items-center gap-2"><Icon name="History" size={16} /> Past {mode === 'hunter' ? 'Hunts' : 'Research'}</h3>
          <div className="space-y-1 max-h-80 overflow-y-auto">
            {(mode === 'hunter' ? hHistory : rHistory).map(h => (
              <div key={h.id} onClick={() => openHistoryEntry(h.id, mode === 'hunter')}
                className="flex items-center justify-between gap-2 p-2.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                <div className="min-w-0 flex-1">
                  <p className="text-sm font-medium truncate">{h.query_text} <span className="text-xs text-slate-400 font-normal">({h.country.toUpperCase()})</span></p>
                  <p className="text-xs text-slate-400">
                    {timeAgo(h.created_at)} · {h.credits_used || 0} credits
                    {h.product_count != null && <> · {h.product_count} products</>}
                  </p>
                </div>
                <button onClick={(e) => deleteHistoryEntry(h.id, mode === 'hunter' ? 'product_hunt' : 'ecommerce', e)}
                  className="text-slate-300 hover:text-red-500 p-1 flex-shrink-0"><Icon name="XCircle" size={16} /></button>
              </div>
            ))}
            {(mode === 'hunter' ? hHistory : rHistory).length === 0 && (
              <p className="text-sm text-slate-400 py-2">No past runs yet.</p>
            )}
          </div>
        </Card>
      )}

      {resumed && (
        <div className="flex items-center justify-between text-xs bg-accent-50 dark:bg-accent-900/20 text-accent-700 dark:text-accent-300 rounded-lg px-3 py-2">
          <span className="flex items-center gap-1.5"><Icon name="History" size={12} /> Showing your last {mode === 'hunter' ? 'hunt' : 'research'} — resumed automatically, 0 credits used.</span>
          <button onClick={() => { setResumed(false); if (mode === 'hunter') setHResult(null); else setResult(null); }} className="hover:underline">Start fresh</button>
        </div>
      )}

      {/* Hunter Search Card */}
      {mode === 'hunter' && (
        <Card>
          <div className="flex flex-col md:flex-row gap-2">
            <div className="flex-1">
              <Input value={hCategory} onChange={setHCategory} placeholder="Enter a niche, e.g. home fitness, camping gear, pet accessories..."
                icon="Crosshair" onKeyDown={e => e.key === 'Enter' && !hLoading && runHunt()} />
            </div>
            <select value={country} onChange={e => setCountry(e.target.value)}
              className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2.5 text-sm min-w-[180px]">
              {COUNTRIES.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
            </select>
            <select value={hCount} onChange={e => setHCount(Number(e.target.value))}
              className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2.5 text-sm">
              {[4, 6, 8, 10].map(n => <option key={n} value={n}>Top {n}</option>)}
            </select>
            <Button onClick={() => runHunt()} disabled={hLoading} className="whitespace-nowrap">
              {hLoading ? <><Spinner /> Hunting...</> : <><Icon name="Crosshair" size={14} /> Hunt Products</>}
            </Button>
          </div>
          {hLoading && (
            <div className="mt-3 flex items-center gap-2 text-sm text-slate-500 fade-in">
              <Spinner /> <span>{hStep}</span>
            </div>
          )}
        </Card>
      )}

      {/* Research Search Card */}
      {mode === 'research' && (
        <Card>
          <div className="flex flex-col md:flex-row gap-2">
            <div className="flex-1">
              <Input value={query} onChange={setQuery} placeholder="e.g. wireless earbuds, yoga mat, fishing rod..."
                icon="Search" onKeyDown={e => e.key === 'Enter' && !loading && run()} />
            </div>
            <select value={country} onChange={e => setCountry(e.target.value)}
              className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2.5 text-sm min-w-[180px]">
              {COUNTRIES.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
            </select>
            <Button onClick={() => run()} disabled={loading} className="whitespace-nowrap">
              {loading ? <><Spinner /> Researching...</> : <><Icon name="Zap" size={14} /> Deep Research</>}
            </Button>
          </div>
          {loading && (
            <div className="mt-3 flex items-center gap-2 text-sm text-slate-500 fade-in">
              <Spinner /> <span>{step}</span>
            </div>
          )}
        </Card>
      )}

      {mode === 'research' && result && (
        <div className="space-y-4 fade-in">

          {/* Cache / provenance row */}
          <div className="flex items-center justify-between text-xs text-slate-400">
            <span>
              Sources: {(result.data_sources || []).join(' · ') || '—'}
              {result.credits_used != null && <span className="ml-2">· {result.credits_used} Serper credits</span>}
            </span>
            <span className="flex items-center gap-3">
              {result.history_id && (
                <a href={API + '/research-history/' + result.history_id + '/csv'}
                  className="text-accent-600 hover:underline flex items-center gap-1">
                  <Icon name="Download" size={11} /> Download CSV
                </a>
              )}
              {result.cached && (
                <span className="flex items-center gap-2">
                  <span className="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-full">cached — 0 credits</span>
                  <button onClick={() => run(result.query, true)} className="text-accent-600 hover:underline flex items-center gap-1">
                    <Icon name="RefreshCw" size={11} /> Refresh
                  </button>
                </span>
              )}
            </span>
          </div>

          {/* AI Verdict Banner */}
          {result.ai_verdict && (

              <button key={s} onClick={() => setHCategory(s)}

      {mode === 'research' && !result && !loading && (

          <p className="text-sm max-w-md mx-auto">

            competition analysis, trends, and an AI verdict on whether it's worth selling.

          <div className="flex flex-wrap justify-center gap-2 mt-4">
            {['wireless earbuds', 'yoga mat', 'LED strip lights', 'fishing rod', 'phone case'].map(s => (
              <button key={s} onClick={() => setQuery(s)}

                {s}

      {/* Score Legend modal — explains Hunter Score & subscores in plain language */}
