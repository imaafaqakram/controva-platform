  </div>
</div>

<script>
  // Global error handler - show errors visibly so we can debug
  window.addEventListener('error', function(e) {
    var d = document.getElementById('error-display');
    if (d) {
      d.style.display = 'block';
      d.textContent = 'Error: ' + e.message + '\n\nFile: ' + e.filename + ':' + e.lineno + '\n\n' + (e.error && e.error.stack ? e.error.stack : '');
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    var d = document.getElementById('error-display');
    if (d) {
      d.style.display = 'block';
      d.textContent = 'Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });

  // Update loading status as scripts load
  var statusEl = document.getElementById('load-status');
  var checkInterval = setInterval(function() {
    if (!statusEl) { clearInterval(checkInterval); return; }
    var loaded = [];
    if (window.React) loaded.push('React');
    if (window.ReactDOM) loaded.push('ReactDOM');
    if (window.Babel) loaded.push('Babel');
    statusEl.textContent = 'Loaded: ' + loaded.join(', ');
    if (loaded.length === 3) clearInterval(checkInterval);
  }, 200);
</script>

// SVG icon component
const Icon = ({ name, className = "w-4 h-4", strokeWidth = 2 }) => {
  const path = ICONS[name];
  if (!path) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className}>
      {path.split('M').filter(Boolean).map((p, i) => <path key={i} d={'M' + p} />)}
    </svg>
  );
};

const { useState, useEffect, useCallback, useMemo, useRef } = React;
const API = window.location.origin;

// ─────────────────────────────────────────────────
//  Theme
// ─────────────────────────────────────────────────
const useTheme = () => {
  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem('theme');
      if (saved) return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem('theme', theme); } catch (e) {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
};

// ─────────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────────
const ToastContext = React.createContext({ showToast: () => {} });
const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const showToast = useCallback((message, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5000);
  }, []);
  return (
    <ToastContext.Provider value={{ showToast }}>
      {children}
      <div className="fixed top-4 right-4 z-50 space-y-2">
        {toasts.map(t => (
          <div key={t.id} className={'fade-in glass max-w-md px-4 py-3 rounded-lg shadow-lg border ' + (
            t.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-700 dark:text-red-300' :
            t.type === 'info' ? 'bg-blue-500/10 border-blue-500/30 text-blue-700 dark:text-blue-300' :
            'bg-green-500/10 border-green-500/30 text-green-700 dark:text-green-300'
          )}>
            <div className="flex items-start gap-2">
              <Icon name={t.type === 'error' ? 'AlertCircle' : t.type === 'info' ? 'Info' : 'CheckCircle2'} className="w-5 h-5 flex-shrink-0 mt-0.5" />
              <p className="text-sm">{t.message}</p>
            </div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = () => React.useContext(ToastContext);

// ─────────────────────────────────────────────────
//  API helper
// ─────────────────────────────────────────────────
const api = {
  get: async (path) => {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },
  post: async (path, body) => {
    const r = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
};

const Card = ({ children, className = '', noPad = false }) => (
  <div className={'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm ' + (noPad ? '' : 'p-5') + ' ' + className}>
    {children}
  </div>
);

const Button = ({ children, onClick, variant = 'primary', size = 'md', disabled, className = '', icon = null }) => {
  const variants = {
    primary: 'bg-accent-600 hover:bg-accent-700 text-white shadow-sm',
    secondary: 'bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-900 dark:text-slate-100',
    ghost: 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300',
    danger: 'bg-red-600 hover:bg-red-700 text-white',
    success: 'bg-green-600 hover:bg-green-700 text-white'
  };
  const sizes = { sm: 'px-2.5 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-5 py-2.5 text-sm' };
  return (
    <button onClick={onClick} disabled={disabled}
      className={'inline-flex items-center justify-center gap-2 font-medium rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed ' + variants[variant] + ' ' + sizes[size] + ' ' + className}>
      {icon && <Icon name={icon} className="w-4 h-4" />}
      {children}
    </button>
  );
};

const Input = ({ value, onChange, placeholder, type = 'text', className = '', icon = null, onKeyDown }) => (
  <div className={'relative ' + className}>
    {icon && <Icon name={icon} className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" />}
    <input type={type} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} onKeyDown={onKeyDown}
      className={'w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-accent-500 transition-all ' + (icon ? 'pl-10 pr-3' : 'px-3') + ' py-2.5'} />
  </div>
);

const Badge = ({ children, variant = 'default' }) => {

    default: 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300',
    success: 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400',
    warning: 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400',
    danger: 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400',
    info: 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400',
    purple: 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400',

};

const Spinner = ({ size = 'w-4 h-4' }) => (

const StatCard = ({ icon, label, value, color = 'blue' }) => {

const DashboardPage = ({ setPage }) => {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [recent, setRecent] = useState([]);

  useEffect(() => {
    Promise.all([api.get('/stats').catch(() => null), api.get('/leads').catch(() => ({ leads: [] }))])
      .then(([s, l]) => { setStats(s); setRecent((l.leads || []).slice(0, 6)); setLoading(false); });
  }, []);

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Dashboard</h1>
        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Real-time overview of your pipeline</p>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard icon="Users" label="Total Leads" value={loading ? '...' : (stats?.total || 0)} color="blue" />
        <StatCard icon="Flame" label="Hot Leads" value={loading ? '...' : (stats?.hot_leads || 0)} color="orange" />
        <StatCard icon="Mail" label="With Email" value={loading ? '...' : (stats?.with_email || 0)} color="green" />
        <StatCard icon="MapPin" label="Cities" value={loading ? '...' : (stats?.cities || 0)} color="purple" />
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <Card className="lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-semibold flex items-center gap-2"><Icon name="Sparkles" /> Recent Leads</h3>
            <Button variant="ghost" size="sm" onClick={() => setPage('leads')}>View All →</Button>
          </div>
          <div className="space-y-2">
            {recent.length === 0 ? (
              <p className="text-sm text-slate-500 py-8 text-center">No leads yet. Start with the Search page.</p>
            ) : recent.map((l, i) => (
              <div key={i} className="flex items-center justify-between p-3 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800">
                <div className="flex-1 min-w-0">
                  <p className="font-medium text-sm truncate">{l.business_name}</p>
                  <p className="text-xs text-slate-500">{l.city} • {l.niche}</p>
                </div>
                <div className="flex items-center gap-1 ml-2">
                  {l.owner_email && <Badge variant="success">📧</Badge>}
                  {l.linkedin_url && <Badge variant="info">in</Badge>}
                  {l.ai_score && <Badge variant="purple">{l.ai_score}/10</Badge>}
                </div>
              </div>
            ))}

};

  const examples = [
    { q: 'barber shops in Manchester UK', emoji: '💇' },
    { q: 'luxury restaurants in Beverly Hills', emoji: '🍽️' },

    { q: 'restaurants in Lahore Pakistan', emoji: '🍛' },
    { q: 'salons in Karachi', emoji: '✂️' },
    { q: 'gyms in Toronto Canada', emoji: '💪' },

  const runSearch = async (q) => {

    setLoading(false);

          <div>

const LeadsPage = () => {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('created_at');
  const [sortDir, setSortDir] = useState('desc');
  const [openLead, setOpenLead] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [advancedFilters, setAdvancedFilters] = useState({ city: '', country: '', niche: '', status: '' });
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [pageNum, setPageNum] = useState(1);
  const [pageSize, setPageSize] = useState(50);
  const { showToast } = useToast();

  // Reset to page 1 whenever the filtered set changes
  useEffect(() => { setPageNum(1); }, [filter, search, advancedFilters, pageSize]);

  const refresh = () => {
    setLoading(true);
    api.get('/leads').then(d => { setLeads(d.leads || []); setLoading(false); }).catch(() => setLoading(false));
  };
  useEffect(refresh, []);

  // Unique values for filter dropdowns
  const uniqueValues = useMemo(() => {
    const cities = new Set(), countries = new Set(), niches = new Set(), statuses = new Set();
    leads.forEach(l => {
      if (l.city) cities.add(l.city);
      if (l.country) countries.add(l.country);
      if (l.niche) niches.add(l.niche);
      if (l.status) statuses.add(l.status);
    });
    return {
      cities: [...cities].sort(),
      countries: [...countries].sort(),
      niches: [...niches].sort(),
      statuses: [...statuses].sort()
    };
  }, [leads]);

  const filtered = useMemo(() => {
    let r = leads;
    if (filter === 'hot') r = r.filter(l => (l.lead_type || '').indexOf('HOT') !== -1);
    else if (filter === 'enriched') r = r.filter(l => !['discovered', 'rejected'].includes(l.status));
    else if (filter === 'with_email') r = r.filter(l => l.owner_email);
    else if (filter === 'with_linkedin') r = r.filter(l => l.linkedin_url);
    else if (filter === 'with_contact') r = r.filter(l => l.owner_email || l.linkedin_url);
    else if (filter === 'scored') r = r.filter(l => parseInt(l.ai_score) >= 7);
    if (search) {
      const q = search.toLowerCase();
      r = r.filter(l => (l.business_name || '').toLowerCase().includes(q) ||
                       (l.city || '').toLowerCase().includes(q) ||
                       (l.country || '').toLowerCase().includes(q) ||
                       (l.niche || '').toLowerCase().includes(q) ||
                       (l.phone || '').includes(q) ||
                       (l.owner_email || '').toLowerCase().includes(q));
    }
    if (advancedFilters.city) r = r.filter(l => l.city === advancedFilters.city);
    if (advancedFilters.country) r = r.filter(l => l.country === advancedFilters.country);
    if (advancedFilters.niche) r = r.filter(l => l.niche === advancedFilters.niche);
    if (advancedFilters.status) r = r.filter(l => l.status === advancedFilters.status);
    if (sortBy) {
      r = [...r].sort((a, b) => {
        let av = a[sortBy], bv = b[sortBy];
        if (sortBy === 'ai_score') { av = parseInt(av) || 0; bv = parseInt(bv) || 0; }
        else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }
    return r;
  }, [leads, filter, search, sortBy, sortDir, advancedFilters]);

  const toggleSelect = (id) => {
    setSelected(s => {
      const next = new Set(s);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  // Page slice + counts derived from filtered + pageNum + pageSize
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.min(pageNum, totalPages);
  const pageStart = (safePage - 1) * pageSize;
  const pageEnd = Math.min(pageStart + pageSize, filtered.length);
  const pageItems = filtered.slice(pageStart, pageEnd);

  const selectAll = () => {
    setSelected(new Set(pageItems.map(l => l.id)));
  };

  const deselectAll = () => setSelected(new Set());

  const downloadSelectedCSV = () => {
    const ids = [...selected];
    const rows = leads.filter(l => ids.includes(l.id));
    if (rows.length === 0) {
      showToast('Select some leads first', 'error');
      return;
    }
    const fields = ['business_name', 'niche', 'city', 'country', 'phone', 'owner_email',
                   'owner_name', 'linkedin_url', 'address', 'ai_score', 'status'];
    const csv = [
      fields.join(','),
      ...rows.map(r => fields.map(f => {
        const v = (r[f] || '').toString().replace(/"/g, '""');
        return v.indexOf(',') >= 0 || v.indexOf('\n') >= 0 ? '"' + v + '"' : v;
      }).join(','))
    ].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leads_selected_' + Date.now() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded ' + rows.length + ' leads');
  };

  const downloadAllCSV = () => { window.location.href = '/leads.csv'; };

  const clearFilters = () => {
    setSearch(''); setFilter('all'); setAdvancedFilters({city:'', country:'', niche:'', status:''});
  };

  return (
    <div className="space-y-4 fade-in">
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold">Leads</h1>
          <p className="text-sm text-slate-500 mt-1">
            {filtered.length} of {leads.length} leads
            {selected.size > 0 && <span className="ml-2 text-accent-600 font-semibold">• {selected.size} selected</span>}
          </p>
        </div>
        <div className="flex gap-2 flex-wrap">
          {selected.size > 0 && (
            <>
              <Button variant="success" onClick={downloadSelectedCSV} icon="Download">
                Download Selected ({selected.size})
              </Button>
              <Button variant="ghost" onClick={deselectAll} icon="X">Clear</Button>
            </>
          )}
          <Button variant="secondary" onClick={refresh} icon="RefreshCw">Refresh</Button>
          <Button variant="secondary" onClick={downloadAllCSV} icon="Download">All CSV</Button>
        </div>
      </div>

      {/* Quick filter chips */}
      <Card>
        <div className="flex flex-col gap-3">
          <div className="flex gap-2 flex-wrap items-center">
            <Input value={search} onChange={setSearch} placeholder="Search across all fields..." icon="Search" className="flex-1 min-w-[240px]" />
            <button onClick={() => setShowAdvanced(!showAdvanced)}
              className={'px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 ' + (
                showAdvanced ? 'bg-accent-600 text-white' : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700'
              )}>
              <Icon name="ListFilter" /> Filters
            </button>
          </div>

          {showAdvanced && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg fade-in">
              <select value={advancedFilters.country} onChange={e => setAdvancedFilters({...advancedFilters, country: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Countries</option>
                {uniqueValues.countries.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={advancedFilters.city} onChange={e => setAdvancedFilters({...advancedFilters, city: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Cities</option>
                {uniqueValues.cities.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={advancedFilters.niche} onChange={e => setAdvancedFilters({...advancedFilters, niche: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Niches</option>
                {uniqueValues.niches.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={advancedFilters.status} onChange={e => setAdvancedFilters({...advancedFilters, status: e.target.value})}
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="">All Statuses</option>
                {uniqueValues.statuses.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div className="col-span-2 md:col-span-4 flex justify-end">
                <Button variant="ghost" size="sm" onClick={clearFilters}>Clear Filters</Button>
              </div>
            </div>
          )}

          <div className="flex gap-2 flex-wrap">
            {[
              { id: 'all',           label: 'All',                count: leads.length },
              { id: 'hot',           label: 'Hot (no website)',   count: leads.filter(l => (l.lead_type || '').indexOf('HOT') !== -1).length },
              { id: 'enriched',      label: 'Enriched',           count: leads.filter(l => !['discovered', 'rejected'].includes(l.status)).length },
              { id: 'with_email',    label: 'Has Email',          count: leads.filter(l => l.owner_email).length },

      {openLead && <LeadDetailModal leadId={openLead} onClose={() => setOpenLead(null)} onUpdate={refresh} />}

};

const SimplePage = ({ title, subtitle, endpoint, fields, renderResult, mode, setMode, modes }) => {
  const [vals, setVals] = useState({});
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const { showToast } = useToast();

  const run = async () => {
    setLoading(true); setResult(null);
    try {
      const r = await api.post(endpoint, vals);
      setResult(r);
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    setLoading(false);
  };

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">{title}</h1>
        <p className="text-sm text-slate-500 mt-1">{subtitle}</p>
      </div>
      {modes && (
        <Card>
          <div className="flex gap-2 mb-4 border-b border-slate-200 dark:border-slate-800 -mx-5 px-5 overflow-x-auto scrollbar-thin">
            {modes.map(t => (
              <button key={t.id} onClick={() => { setMode(t.id); setResult(null); }}
                className={'px-3 py-2 text-sm font-medium border-b-2 -mb-px flex items-center gap-2 whitespace-nowrap ' + (
                  mode === t.id ? 'border-accent-500 text-accent-600' : 'border-transparent text-slate-500'
                )}>
                <Icon name={t.icon} /> {t.label}
              </button>
            ))}
          </div>
          <div className="flex gap-2 flex-wrap">
            {fields.map(f => (
              <Input key={f.key} value={vals[f.key] || ''} onChange={v => setVals({...vals, [f.key]: v})}
                placeholder={f.placeholder} icon={f.icon} className={f.full ? 'w-full' : 'flex-1 min-w-[150px]'}
                onKeyDown={(e) => e.key === 'Enter' && run()} />
            ))}
            <Button onClick={run} disabled={loading}>{loading ? <Spinner /> : 'Run'}</Button>
          </div>
        </Card>
      )}
      {!modes && (
        <Card>
          <div className="flex gap-2 flex-wrap">
            {fields.map(f => (
              <Input key={f.key} value={vals[f.key] || ''} onChange={v => setVals({...vals, [f.key]: v})}
                placeholder={f.placeholder} icon={f.icon} className="flex-1 min-w-[150px]"
                onKeyDown={(e) => e.key === 'Enter' && run()} />
            ))}
            <Button onClick={run} disabled={loading}>{loading ? <Spinner /> : 'Run'}</Button>
          </div>
        </Card>
      )}
      {result && renderResult && renderResult(result)}
    </div>
  );
};

const PipelinePage = () => {
  const [provider, setProvider] = useState('serper_then_oxylabs');
  const [includeImages, setIncludeImages] = useState(false);
  const [jobId, setJobId] = useState(null);
  const [job, setJob] = useState(null);
  const [stepLabel, setStepLabel] = useState('');
  const { showToast } = useToast();

  const startPolling = (id, label) => {
    setJobId(id);
    setStepLabel(label || '');
    setJob(null);
  };

  const run = async () => {
    try {
      const r = await api.post('/run-pipeline', { provider, generate_images: includeImages });
      startPolling(r.job_id, 'Full Pipeline');
      showToast('Pipeline started', 'info');
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
  };

  useEffect(() => {
    if (!jobId) return;
    const poll = setInterval(async () => {
      try {
        const j = await api.get('/job/' + jobId);
        setJob(j);
        if (j.status === 'completed') {
          clearInterval(poll);
          const count = j.results ? (j.results.total ?? j.results.enriched ?? '') : '';
          showToast(`${stepLabel || 'Job'} completed${count !== '' ? ': ' + count + ' items' : ''}`, 'success');
        } else if (j.status === 'failed') {
          clearInterval(poll);
          showToast(`${stepLabel || 'Job'} failed: ${j.error || 'unknown error'}`, 'error');
        }
      } catch (e) { clearInterval(poll); }
    }, 2000);
    return () => clearInterval(poll);
  }, [jobId]);

  const runStep = async (path, label, extraBody = {}) => {
    try {
      showToast('Starting: ' + label, 'info');
      const r = await api.post(path, extraBody);
      if (r.job_id) {
        startPolling(r.job_id, label);
      } else {
        showToast(label + ' done: ' + (r.total ?? (r.results || []).length) + ' items', 'success');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
  };

  return (
    <div className="space-y-6 fade-in max-w-3xl">
      <div>
        <h1 className="text-2xl font-bold">Pipeline</h1>
        <p className="text-sm text-slate-500 mt-1">Enrich, score, prepare for outreach</p>
      </div>
      <Card>
        <h3 className="font-semibold mb-4">Enrichment Strategy</h3>
        <div className="space-y-3">
          {[
            { id: 'serper_only', label: 'Serper Only', desc: 'Fastest', icon: 'Zap' },
            { id: 'oxylabs_only', label: 'Oxylabs Only', desc: 'Deep scrape', icon: 'Shield' },
            { id: 'serper_then_oxylabs', label: 'Smart (Recommended)', desc: 'Serper first, Oxylabs for missing', icon: 'Sparkles' },
            { id: 'free_only', label: '100% Free', desc: 'Serper + permutator', icon: 'Gift' },
          ].map(opt => (
            <label key={opt.id} className={'flex items-start gap-3 p-3 rounded-lg border-2 cursor-pointer ' + (
              provider === opt.id ? 'border-accent-500 bg-accent-50 dark:bg-accent-900/20' : 'border-slate-200 dark:border-slate-800'
            )}>
              <input type="radio" checked={provider === opt.id} onChange={() => setProvider(opt.id)} className="mt-1" />
              <div className="flex-1">
                <div className="font-medium text-sm flex items-center gap-2"><Icon name={opt.icon} /> {opt.label}</div>
                <p className="text-xs text-slate-500 mt-0.5">{opt.desc}</p>
              </div>
            </label>
          ))}
        </div>
      </Card>
      <Card>
        <label className="flex items-center gap-3">
          <input type="checkbox" checked={includeImages} onChange={e => setIncludeImages(e.target.checked)} className="w-4 h-4" />
          <div>
            <div className="font-medium text-sm">Generate mockup images</div>
            <p className="text-xs text-slate-500">OFF by default to save costs</p>
          </div>
        </label>
      </Card>
      <Card>
        <Button onClick={run} icon="Play" size="lg" className="w-full">Run Full Pipeline</Button>
        {job && (
          <div className="mt-4 space-y-2">
            <div className="flex items-center justify-between mb-1">
              <span className="text-xs font-semibold text-slate-600 dark:text-slate-400">
                {stepLabel || 'Pipeline'} —&nbsp;
                <span className={
                  job.status === 'completed' ? 'text-green-600' :
                  job.status === 'failed'    ? 'text-red-500' :
                  'text-amber-500'
                }>{job.status}</span>
              </span>
              {(job.status === 'completed' || job.status === 'failed') && (
                <button onClick={() => { setJob(null); setJobId(null); }}
                  className="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 underline">Clear</button>
              )}
            </div>
            <div className="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-2">
              {job.status === 'running' || (job.progress > 0 && job.progress < 100)
                ? <div className="bg-gradient-to-r from-accent-500 to-green-500 h-2 rounded-full animate-pulse" style={{ width: Math.max(job.progress || 8, 8) + '%' }} />
                : <div className={`h-2 rounded-full transition-all ${job.status === 'completed' ? 'bg-green-500' : job.status === 'failed' ? 'bg-red-500' : 'bg-gradient-to-r from-accent-500 to-green-500'}`} style={{ width: (job.progress || 0) + '%' }} />
              }
            </div>
            <div className="bg-slate-50 dark:bg-slate-900 rounded p-2 max-h-40 overflow-y-auto font-mono text-xs space-y-0.5">
              {(job.log || []).map((l, i) => (
                <div key={i} className={l.startsWith('Error') ? 'text-red-500' : l.startsWith('Done') ? 'text-green-600 font-semibold' : 'text-slate-600 dark:text-slate-400'}>{l}</div>
              ))}
              {(job.status === 'running' || job.status === 'enriching' || job.status === 'scoring' || job.status === 'generating') && (
                <div className="flex items-center gap-1 text-amber-500 mt-1"><Spinner /><span>Working…</span></div>
              )}
            </div>
            {job.status === 'completed' && job.results && (
              <div className="flex flex-wrap gap-2 pt-1">
                {Object.entries(job.results).map(([k, v]) => (
                  <span key={k} className="text-xs bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 px-2 py-0.5 rounded-full">{k}: {v}</span>
                ))}
              </div>
            )}
          </div>

const ApiKeyEditor = () => {
  const [keys, setKeys] = useState({});
  const [editing, setEditing] = useState({});
  const [values, setValues] = useState({});
  const { showToast } = useToast();

  useEffect(() => { api.get('/api-keys').then(setKeys).catch(() => {}); }, []);

  const startEdit = (k) => { setEditing({...editing, [k]: true}); setValues({...values, [k]: ''}); };
  const cancelEdit = (k) => { setEditing({...editing, [k]: false}); setValues({...values, [k]: ''}); };

  const save = async (k) => {
    if (!values[k]) { showToast('Enter a value first', 'error'); return; }
    try {
      const r = await api.post('/api-keys/update', { key: k, value: values[k] });
      if (r.success) {
        showToast('Updated ' + k);
        setEditing({...editing, [k]: false});
        // Refresh
        api.get('/api-keys').then(setKeys).catch(() => {});
      } else {
        showToast('Failed', 'error');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
  };

  const labels = {
    google_api_key:  'Google Places API',
    serper_key:      'Serper.dev',
    gemini_key:      'Google Gemini',
    claude_key:      'Anthropic Claude',
    replicate_token: 'Replicate (FLUX images)',
    imagine_art_key: 'imagine.art',
    oxylabs_key:     'Oxylabs AI Studio',
    resend_key:      'Resend.com (email)',
    from_email:      'From Email',
    from_name:       'From Name',
  };

  return (
    <div className="space-y-2">
      {Object.entries(labels).map(([key, label]) => {
        const k = keys[key] || { set: false, preview: '' };
        const isEditing = editing[key];
        return (
          <div key={key} className="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-800 rounded-lg">
            <div className="flex-1 min-w-0">
              <p className="text-xs font-medium">{label}</p>
              {isEditing ? (
                <Input value={values[key] || ''} onChange={v => setValues({...values, [key]: v})}
                  placeholder={'Enter new ' + label} className="mt-1" type="password" />
              ) : (
                <p className="text-xs font-mono text-slate-500 truncate mt-0.5">
                  {k.set ? k.preview : <span className="text-orange-500">Not set</span>}
                </p>
              )}
            </div>
            {isEditing ? (
              <div className="flex gap-1">
                <Button size="sm" variant="success" onClick={() => save(key)} icon="Check">Save</Button>
                <Button size="sm" variant="ghost" onClick={() => cancelEdit(key)} icon="X">Cancel</Button>
              </div>
            ) : (
              <Button size="sm" variant="secondary" onClick={() => startEdit(key)} icon="Edit3">
                {k.set ? 'Change' : 'Set'}
              </Button>
            )}
          </div>
        );
      })}
    </div>
  );
};

const IntentPage = () => {
  const [query, setQuery] = useState('');
  const [direction, setDirection] = useState('demand');
  const [location, setLocation] = useState('');
  const [recency, setRecency] = useState(30);
  const [running, setRunning] = useState(false);
  const [results, setResults] = useState([]);
  const [status, setStatus] = useState('');
  const [savedLeads, setSavedLeads] = useState([]);
  const [stats, setStats] = useState(null);
  const { showToast } = useToast();

  const loadSaved = () => {
    api.get('/intent-leads?direction=' + direction + '&limit=200')
      .then(d => setSavedLeads(d.leads || []))
      .catch(() => {});
    api.get('/intent-stats').then(setStats).catch(() => {});
  };

  useEffect(() => { loadSaved(); }, [direction]);

  const runSearch = async () => {
    if (!query.trim()) { showToast('Enter a query', 'error'); return; }
    setRunning(true); setResults([]); setStatus('');
    try {
      const r = await api.post('/intent-search', {
        query, direction, location, recency_days: parseInt(recency),
        min_confidence: 55, per_source_limit: 3, max_results: 30
      });
      setResults(r.results || []);
      setStatus(r.status || '');
      showToast(r.message || 'Done', r.total > 0 ? 'success' : 'info');
      loadSaved();
    } catch (e) {
      showToast('Search failed: ' + e.message, 'error');
    } finally { setRunning(false); }
  };

const LeadDetailModal = ({ leadId, onClose, onUpdate }) => {
  const [lead, setLead] = useState(null);
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const [editingEmail, setEditingEmail] = useState(false);
  const [editedSubject, setEditedSubject] = useState('');
  const [editedBody, setEditedBody] = useState('');
  const { showToast } = useToast();

  useEffect(() => {
    if (!leadId) return;
    setLoading(true);
    api.get('/lead/' + leadId).then(d => {
      setLead(d);
      setEditedSubject(d.email_subject || '');
      setEditedBody(d.email_body || '');
      setLoading(false);
    }).catch(e => { showToast('Failed to load: ' + e.message, 'error'); setLoading(false); });
  }, [leadId]);

  const sendEmail = async () => {
    if (!confirm('Send this email to ' + lead.owner_email + '?')) return;
    setSending(true);
    try {
      const r = await api.post('/lead/' + leadId + '/send', {});
      if (r.success) {
        showToast('Email sent successfully!');
        if (onUpdate) onUpdate();
        onClose();
      } else {
        showToast('Failed: ' + (r.error || 'Unknown error'), 'error');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    setSending(false);
  };

  const approve = async () => {
    try { await api.post('/lead/' + leadId + '/approve', {}); showToast('Approved'); if (onUpdate) onUpdate(); }
    catch (e) { showToast('Failed', 'error'); }
  };
  const reject = async () => {
    if (!confirm('Reject this lead?')) return;
    try { await api.post('/lead/' + leadId + '/reject', {}); showToast('Rejected'); if (onUpdate) onUpdate(); onClose(); }
    catch (e) { showToast('Failed', 'error'); }
  };
  const regenerate = async () => {
    try {
      const r = await api.post('/lead/' + leadId + '/regenerate-email', {});
      if (r.success) {
        setEditedSubject(r.subject);
        setEditedBody(r.body);
        showToast('Email regenerated');
      }
    } catch (e) { showToast('Failed', 'error'); }
  };

  if (!leadId) return null;

  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-slate-900 rounded-xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto scrollbar-thin" onClick={e => e.stopPropagation()}>
        {loading ? (
          <div className="p-12 text-center"><Spinner size="w-8 h-8" /></div>
        ) : !lead ? (
          <div className="p-12 text-center text-slate-500">Lead not found</div>
        ) : (
          <>
            <div className="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-5 flex items-center justify-between">
              <div className="min-w-0 flex-1">
                <h2 className="text-lg font-bold truncate">{lead.business_name}</h2>
                <p className="text-xs text-slate-500">{lead.niche} • {lead.city}, {lead.country} • Status: <Badge variant="info">{lead.status}</Badge></p>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>
            <div className="p-5 space-y-4">
              {/* Contact info */}
              <div className="grid grid-cols-2 gap-3">
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Phone</p>
                  <p className="font-mono text-sm text-cyan-600">{lead.phone || '—'}</p>
                </div>
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Email</p>
                  <p className="font-mono text-sm text-cyan-600 truncate">{lead.owner_email || '—'}</p>
                </div>
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Owner</p>
                  <p className="text-sm">{lead.owner_name || '—'}</p>
                </div>
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">AI Score</p>
                  <p className="text-sm font-bold">{lead.ai_score ? lead.ai_score + '/10' : '—'}</p>
                </div>
              </div>
              {lead.address && (
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Address</p>
                  <p className="text-sm">{lead.address}</p>
                </div>
              )}
              {lead.linkedin_url && (
                <a href={lead.linkedin_url} target="_blank" className="block p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg hover:bg-blue-100">
                  <p className="text-xs text-slate-500">LinkedIn</p>
                  <p className="text-sm text-blue-600">{lead.linkedin_url}</p>
                </a>
              )}

              {/* Timeline */}
              <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                <p className="text-xs text-slate-500 uppercase font-medium mb-2">Activity Timeline</p>
                <div className="space-y-1.5">
                  <div className="flex items-center gap-2 text-xs">
                    <span className="w-2 h-2 rounded-full bg-green-400 flex-shrink-0"></span>
                    <span className="text-slate-500 w-24">Discovered</span>
                    <span className="font-mono text-slate-700 dark:text-slate-300">{lead.date_found || '—'}</span>
                  </div>
                  {lead.status !== 'discovered' && (
                    <div className="flex items-center gap-2 text-xs">
                      <span className="w-2 h-2 rounded-full bg-blue-400 flex-shrink-0"></span>
                      <span className="text-slate-500 w-24">Last updated</span>
                      <span className="font-mono text-slate-700 dark:text-slate-300">{lead.date_updated || '—'}</span>
                    </div>
                  )}
                  <div className="flex items-center gap-2 text-xs">
                    <span className="w-2 h-2 rounded-full bg-purple-400 flex-shrink-0"></span>
                    <span className="text-slate-500 w-24">Status</span>
                    <Badge variant={lead.status === 'ready' ? 'success' : lead.status === 'sent' ? 'purple' : lead.status === 'enriched' ? 'info' : 'default'}>{lead.status}</Badge>
                  </div>
                </div>
              </div>

              {/* Mockup */}
              {lead.mockup_url && (
                <div>
                  <p className="text-xs text-slate-500 mb-2 uppercase font-medium">Website Mockup</p>
                  <img src={lead.mockup_url} alt="Mockup" className="w-full rounded-lg border border-slate-200 dark:border-slate-800" />
                </div>
              )}

              {/* Email preview / editor */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs text-slate-500 uppercase font-medium">Email Preview</p>
                  <div className="flex gap-2">
                    <Button size="sm" variant="ghost" onClick={() => setEditingEmail(!editingEmail)} icon="Edit3">
                      {editingEmail ? 'Done' : 'Edit'}
                    </Button>
                    <Button size="sm" variant="ghost" onClick={regenerate} icon="RotateCw">Regenerate</Button>
                  </div>
                </div>
                {editingEmail ? (
                  <div className="space-y-2">
                    <Input value={editedSubject} onChange={setEditedSubject} placeholder="Subject" />
                    <textarea value={editedBody} onChange={e => setEditedBody(e.target.value)}
                      className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-3 text-sm font-mono min-h-[200px]" />
                  </div>
                ) : (
                  <div className="bg-slate-50 dark:bg-slate-800 rounded-lg p-4 border border-slate-200 dark:border-slate-700">
                    <p className="font-semibold text-sm mb-2">{editedSubject || lead.email_subject || '(no subject)'}</p>
                    <div className="text-sm whitespace-pre-wrap">{editedBody || lead.email_body || '(no body)'}</div>
                  </div>
                )}
              </div>

              {/* Actions */}
              <div className="flex gap-2 sticky bottom-0 bg-white dark:bg-slate-900 pt-3 border-t border-slate-200 dark:border-slate-800">
                <Button onClick={sendEmail} variant="success" icon="Send" disabled={sending || !lead.owner_email || lead.status === 'sent'}>
                  {sending ? <Spinner /> : lead.status === 'sent' ? 'Already Sent' : 'Send Email'}
                </Button>
                <Button onClick={approve} variant="primary" icon="Check">Approve</Button>
                <Button onClick={reject} variant="danger" icon="XCircle">Reject</Button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
};

const OutreachPage = () => {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedLead, setSelectedLead] = useState(null);
  const [outreachLog, setOutreachLog] = useState([]);
  const [view, setView] = useState('ready');

  const refresh = () => {
    setLoading(true);
    Promise.all([
      api.get('/leads').catch(() => ({ leads: [] })),
      api.get('/outreach').catch(() => ({ log: [] }))
    ]).then(([l, o]) => {
      setLeads(l.leads || []);
      setOutreachLog(o.log || []);
      setLoading(false);
    });
  };
  useEffect(refresh, []);

  const readyLeads = leads.filter(l => l.status === 'ready' && l.owner_email);
  const approvedLeads = leads.filter(l => l.status === 'approved');
  const sentCount = outreachLog.length;

  let displayed = readyLeads;
  if (view === 'approved') displayed = approvedLeads;
  else if (view === 'sent') displayed = outreachLog;

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Outreach</h1>
        <p className="text-sm text-slate-500 mt-1">Review and send personalized emails</p>
      </div>

      <div className="grid grid-cols-3 gap-3">
        <button onClick={() => setView('ready')}
          className={'p-4 rounded-xl border-2 text-left transition-colors ' + (
            view === 'ready' ? 'border-accent-500 bg-accent-50 dark:bg-accent-900/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'
          )}>
          <div className="flex items-center gap-2">
            <Icon name="Inbox" className="w-5 h-5 text-accent-600" />
            <span className="text-sm font-medium">Ready</span>
          </div>
          <p className="text-2xl font-bold mt-1">{readyLeads.length}</p>
        </button>
        <button onClick={() => setView('approved')}
          className={'p-4 rounded-xl border-2 text-left ' + (
            view === 'approved' ? 'border-green-500 bg-green-50 dark:bg-green-900/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'
          )}>
          <div className="flex items-center gap-2">
            <Icon name="Check" className="w-5 h-5 text-green-600" />
            <span className="text-sm font-medium">Approved</span>
          </div>
          <p className="text-2xl font-bold mt-1">{approvedLeads.length}</p>

        <button onClick={() => setView('sent')}
          className={'p-4 rounded-xl border-2 text-left ' + (
            view === 'sent' ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'
          )}>
          <div className="flex items-center gap-2">
            <Icon name="Send" className="w-5 h-5 text-purple-600" />
            <span className="text-sm font-medium">Sent</span>
          </div>
          <p className="text-2xl font-bold mt-1">{sentCount}</p>
        </button>
      </div>

      {loading ? (
        <Card><div className="py-12 text-center"><Spinner size="w-6 h-6" /></div></Card>
      ) : view === 'sent' ? (
        <Card>
          <h3 className="font-semibold mb-3">Sent Emails</h3>
          {outreachLog.length === 0 ? (
            <p className="text-sm text-slate-500 py-8 text-center">No emails sent yet</p>
          ) : (
            <div className="space-y-2">
              {outreachLog.map((o, i) => (
                <div key={i} className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <div className="flex items-center justify-between">
                    <div className="min-w-0 flex-1">
                      <p className="font-medium text-sm">{o.business_name}</p>
                      <p className="text-xs text-slate-500 truncate">{o.email_subject}</p>
                      <p className="text-xs font-mono text-cyan-600 truncate">{o.email_to}</p>
                    </div>
                    <div className="ml-2 text-right text-xs">
                      <Badge variant={o.status === 'sent' ? 'success' : 'info'}>{o.status}</Badge>
                      <p className="text-slate-500 mt-1">{o.sent_at ? new Date(o.sent_at).toLocaleString() : ''}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>
      ) : (
        <div className="space-y-3">
          {displayed.length === 0 ? (
            <Card>
              <div className="py-12 text-center text-slate-500">
                <p>No leads {view === 'ready' ? 'ready for review' : 'approved'} yet</p>
                <p className="text-xs mt-2">Go to <strong>Pipeline</strong> page and run enrichment first</p>
              </div>
            </Card>
          ) : displayed.map((l, i) => (
            <Card key={i} className="hover:border-accent-300 transition-colors cursor-pointer" >
              <div onClick={() => setSelectedLead(l.id || l.business_name)} className="cursor-pointer">
                <div className="flex items-start justify-between gap-4">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 mb-2">
                      <h3 className="font-semibold">{l.business_name}</h3>
                      {l.ai_score && <Badge variant={parseInt(l.ai_score) >= 8 ? 'success' : 'info'}>{l.ai_score}/10</Badge>}
                      <Badge variant="info">{l.city}</Badge>
                    </div>
                    <p className="text-sm text-slate-600 dark:text-slate-400">
                      <strong>To:</strong> {l.owner_email}
                    </p>
                    {l.email_subject && (
                      <p className="text-sm font-medium mt-2">{l.email_subject}</p>
                    )}
                    {l.email_body && (
                      <p className="text-xs text-slate-500 mt-1 line-clamp-2">{l.email_body.substring(0, 200)}...</p>
                    )}
                  </div>
                  {l.mockup_url && (
                    <img src={l.mockup_url} alt="Mockup" className="w-24 h-16 object-cover rounded border border-slate-200 dark:border-slate-800" />
                  )}
                </div>
                <div className="mt-3 flex justify-end">
                  <Button size="sm" variant="ghost" icon="ExternalLink">Open</Button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      {selectedLead && (
        <LeadDetailModal leadId={selectedLead} onClose={() => setSelectedLead(null)} onUpdate={refresh} />
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────
//  Analytics / Charts Page
// ─────────────────────────────────────────────────
const SimpleBarChart = ({ data, label = 'count', max }) => {
  const maxVal = max || Math.max(...data.map(d => d[label]), 1);
  return (
    <div className="space-y-2">
      {data.map((d, i) => (
        <div key={i} className="flex items-center gap-2">
          <div className="text-xs w-32 truncate text-slate-600 dark:text-slate-400">{d.niche || d.city || d.status || d.bucket || d.date}</div>
          <div className="flex-1 h-6 bg-slate-100 dark:bg-slate-800 rounded overflow-hidden relative">
            <div className="h-full bg-gradient-to-r from-accent-500 to-purple-500 rounded transition-all"
              style={{ width: ((d[label] / maxVal) * 100) + '%' }} />
            <span className="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium">{d[label]}</span>
          </div>
        </div>
      ))}
    </div>
  );
};

const AnalyticsPage = () => {
  const [charts, setCharts] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api.get('/stats-chart').then(d => { setCharts(d); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  if (loading) return <div className="text-center py-12"><Spinner size="w-6 h-6" /></div>;
  if (!charts) return <div>Failed to load</div>;

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Analytics</h1>
        <p className="text-sm text-slate-500 mt-1">Visualize pipeline performance</p>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Activity" /> Leads Per Day (14 days)</h3>
          {charts.leads_per_day.length === 0 ? (
            <p className="text-sm text-slate-500 py-8 text-center">No data yet</p>
          ) : (
            <SimpleBarChart data={charts.leads_per_day} />
          )}
        </Card>

        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="PieChart" /> Status Breakdown</h3>
          <SimpleBarChart data={charts.status_breakdown} />
        </Card>

        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Tag" /> Top Niches</h3>
          <SimpleBarChart data={charts.niche_breakdown} />
        </Card>

        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="MapPin" /> Top Cities</h3>
          <SimpleBarChart data={charts.city_breakdown} />
        </Card>

        <Card className="lg:col-span-2">
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Star" /> AI Score Distribution</h3>
          <SimpleBarChart data={charts.score_distribution} />
        </Card>
      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────
//  Auth: Login Screen
// ─────────────────────────────────────────────────
const LoginScreen = ({ onLogin }) => {
  const [username, setUsername] = useState('admin');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const submit = async () => {
    setLoading(true); setError('');
    try {
      const r = await api.post('/auth/login', { username, password });
      if (r.success) {
        localStorage.setItem('auth_token', r.token);
        onLogin(r.token);
      } else {
        setError(r.error || 'Invalid credentials');
      }
    } catch (e) { setError('Login failed: ' + e.message); }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 to-blue-50 dark:from-slate-950 dark:to-slate-900">
      <Card className="w-full max-w-md">
        <div className="text-center mb-6">
          <div className="w-16 h-16 mx-auto bg-gradient-to-br from-accent-500 to-purple-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-xl pulse-glow">C</div>
          <h1 className="text-xl font-bold mt-4">Controva Intelligence</h1>
          <p className="text-sm text-slate-500 mt-1">Sign in to continue</p>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">Username</label>
            <Input value={username} onChange={setUsername} icon="User" />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">Password</label>
            <Input value={password} onChange={setPassword} type="password" icon="Lock"
              onKeyDown={e => e.key === 'Enter' && submit()} />
          </div>
          {error && <p className="text-xs text-red-600 dark:text-red-400">{error}</p>}
          <Button onClick={submit} disabled={loading} className="w-full" icon="Lock">
            {loading ? <Spinner /> : 'Sign In'}
          </Button>
        </div>
      </Card>
    </div>
  );
};


// ─────────────────────────────────────────────────
//  Main App
// ─────────────────────────────────────────────────
const App = () => {
  const [theme, toggleTheme] = useTheme();
  const [page, setPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const nav = [
    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'search',    label: 'Search',    icon: 'Search' },
    { id: 'leads',     label: 'Leads',     icon: 'Users' },
    { id: 'pipeline',  label: 'Pipeline',  icon: 'Workflow' },
    { id: 'outreach',  label: 'Outreach',  icon: 'Send' },
    { id: 'analytics', label: 'Analytics', icon: 'Activity' },
    { id: 'divider1' },
    { id: 'intent',    label: 'Intent',    icon: 'Crosshair' },
    { id: 'seo',         label: 'SEO',         icon: 'TrendingUp' },
    { id: 'competitor',  label: 'Competitors', icon: 'Target' },
    { id: 'people',      label: 'People',      icon: 'UserSearch' },
    { id: 'social',      label: 'Social',      icon: 'Share2' },
    { id: 'ecommerce',   label: 'E-commerce',  icon: 'ShoppingBag' },
    { id: 'divider2' },
    { id: 'settings',  label: 'Settings',  icon: 'Settings' },
  ];

  let CurrentPage = DashboardPage;
  if (page === 'search') CurrentPage = SearchPage;
  else if (page === 'leads') CurrentPage = LeadsPage;
  else if (page === 'pipeline') CurrentPage = PipelinePage;
  else if (page === 'seo') CurrentPage = SEOPage;
  else if (page === 'competitor') CurrentPage = CompetitorPage;
  else if (page === 'people') CurrentPage = PeoplePage;
  else if (page === 'social') CurrentPage = SocialPage;
  else if (page === 'ecommerce') CurrentPage = EcommercePage;
  else if (page === 'outreach') CurrentPage = OutreachPage;
  else if (page === 'analytics') CurrentPage = AnalyticsPage;
  else if (page === 'intent') CurrentPage = IntentPage;
  else if (page === 'settings') CurrentPage = SettingsPage;

  return (
    <div className="min-h-screen flex">
      <aside className={(sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0') + ' fixed lg:sticky top-0 z-40 w-64 h-screen bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-transform flex flex-col'}>
        <div className="p-5 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 bg-gradient-to-br from-accent-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold shadow-lg pulse-glow">C</div>
            <div>
              <p className="font-bold text-sm leading-tight">Controva</p>
              <p className="text-xs text-slate-500">Intelligence Platform</p>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-0.5 overflow-y-auto scrollbar-thin flex-1">
          {nav.map(item => item.id.indexOf('divider') === 0 ? (
            <div key={item.id} className="my-2 border-t border-slate-200 dark:border-slate-800" />
          ) : (
            <button key={item.id} onClick={() => { setPage(item.id); setSidebarOpen(false); }}
              className={'w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors ' + (
                page === item.id ? 'bg-accent-50 dark:bg-accent-900/30 text-accent-700 dark:text-accent-400'
                                 : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
              )}>
              <Icon name={item.icon} className="w-4 h-4" />
              {item.label}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-slate-200 dark:border-slate-800">
          <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
            <Icon name={theme === 'dark' ? 'Sun' : 'Moon'} className="w-4 h-4" />
            {theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
          </button>
        </div>
      </aside>
      {sidebarOpen && <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 z-30 bg-black/50 lg:hidden" />}
      <main className="flex-1 min-w-0">
        <header className="sticky top-0 z-20 bg-white/80 dark:bg-slate-950/80 glass border-b border-slate-200 dark:border-slate-800">
          <div className="px-5 py-3 flex items-center justify-between">
            <button onClick={() => setSidebarOpen(true)} className="lg:hidden p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800">
              <Icon name="Menu" className="w-5 h-5" />
            </button>
            <div className="flex items-center gap-2 text-xs text-slate-500">
              <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse" />
              <span>Server online</span>
            </div>
          </div>
        </header>
        <div className="p-5 lg:p-8 w-full">
          <CurrentPage setPage={setPage} />
        </div>
      </main>
    </div>
  );
};

// Auth wrapper
const AuthWrapper = () => {
  const [authToken, setAuthToken] = useState(() => {
    try { return localStorage.getItem('auth_token'); } catch (e) { return null; }
  });
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    if (!authToken) { setChecking(false); return; }
    api.post('/auth/check', { token: authToken })
      .then(r => { if (!r.authenticated) { setAuthToken(null); try { localStorage.removeItem('auth_token'); } catch (e) {} } })
      .finally(() => setChecking(false));
  }, []);

  if (checking) return <div className="min-h-screen flex items-center justify-center"><Spinner size="w-8 h-8" /></div>;
  if (!authToken) return <LoginScreen onLogin={(t) => setAuthToken(t)} />;
  return <App />;
};

// Mount
ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider><AuthWrapper /></ToastProvider>
);
</script>

</body>
