              <button onClick={() => setShowLegend(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg"><Icon name="X" size={16} /></button>
            </div>
            <div className="p-5 space-y-5 text-sm">
              <div>
                <p className="font-semibold mb-2">Hunter Score (0-100)</p>
                <p className="text-slate-500 mb-2">The sum of four subscores below. It's a starting point for research, not a guarantee — always check the "Found via" sources and the live example link before sourcing inventory.</p>
                <div className="space-y-1.5">
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-green-500"></span> <b>66-100</b> — Strong opportunity</div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-yellow-500"></span> <b>41-65</b> — Needs more research / test a small batch first</div>
                  <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-red-500"></span> <b>0-40</b> — Weak, likely skip</div>
                </div>
              </div>
              <div>
                <p className="font-semibold mb-2">The four subscores</p>
                <div className="space-y-3">
                  <div>
                    <p className="font-medium">Demand <span className="text-slate-400 font-normal">— out of 30</span></p>
                    <p className="text-slate-500 text-xs">How much real buying interest exists — pulled from review counts/velocity, best-seller mentions, and search signals. Higher = more people actively buying this.</p>
                  </div>
                  <div>
                    <p className="font-medium">Competition <span className="text-slate-400 font-normal">— out of 25</span></p>
                    <p className="text-slate-500 text-xs">Higher score = LESS competition = easier for you to compete. Based on the number of active listings already selling this product.</p>
                  </div>
                  <div>
                    <p className="font-medium">Margin <span className="text-slate-400 font-normal">— out of 25</span></p>
                    <p className="text-slate-500 text-xs">How healthy the resale price point looks for profit. Products priced roughly $15-$80 score highest — enough margin to matter, not so expensive that returns/risk eat your profit.</p>
                  </div>
                  <div>
                    <p className="font-medium">Trend <span className="text-slate-400 font-normal">— out of 20</span></p>
                    <p className="text-slate-500 text-xs">Whether search interest for this niche is rising, flat, or falling right now, from Google Trends signals.</p>
                  </div>
                </div>
              </div>
              <div>
                <p className="font-semibold mb-2">Verdict tags</p>
                <div className="space-y-1.5 text-xs">
                  <p><span className="font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300">BUY</span> — the data supports sourcing this now</p>
                  <p><span className="font-bold px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-300">TEST</span> — promising, but start with a small batch to confirm demand yourself</p>
                  <p><span className="font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300">AVOID</span> — competition or margin makes this a poor bet right now</p>
                </div>
              </div>
              <div>
                <p className="font-semibold mb-2">"Verified" badge</p>
                <p className="text-slate-500 text-xs">Every product shown has been independently confirmed against at least one real, live source (eBay, Amazon, or Google Shopping) before it's scored — hover the badge to see exactly which sources confirmed it. Any AI-suggested product that couldn't be confirmed anywhere is dropped automatically, not shown with a guessed score.</p>
              </div>
              <div>
                <p className="font-semibold mb-2">Estimated sales figures</p>
                <p className="text-slate-500 text-xs">Monthly sales/units are statistical estimates derived from visible sold listings and review activity — not measured, guaranteed sales data. Treat them as directional, the same way professional tools like Jungle Scout or Helium 10 caveat their BSR-based estimates.</p>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const ApiKeyEditor = () => {
  const [keys, setKeys] = useState({});
  const [editing, setEditing] = useState({});
  const [values, setValues] = useState({});
  const { showToast } = useToast();

  useEffect(() => { api.get('/api-keys').then(setKeys).catch(() => {}); }, []);

  const startEdit = (k) => { setEditing({...editing, [k]: true}); setValues({...values, [k]: ''}); };
  const cancelEdit = (k) => { setEditing({...editing, [k]: false}); setValues({...values, [k]: ''}); };

  const save = async (k) => {
    if (!values[k]) { showToast('Enter a value first', 'error'); return; }
    try {
      const r = await api.post('/api-keys/update', { key: k, value: values[k] });
      if (r.success) {
        showToast('Updated ' + k);
        setEditing({...editing, [k]: false});
        // Refresh
        api.get('/api-keys').then(setKeys).catch(() => {});
      } else {
        showToast('Failed', 'error');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
  };

  const labels = {
    google_api_key:  'Google Places API',
    serper_key:      'Serper.dev',
    gemini_key:      'Google Gemini',
    claude_key:      'Anthropic Claude',
    replicate_token: 'Replicate (FLUX images)',
    imagine_art_key: 'imagine.art',
    oxylabs_key:     'Oxylabs AI Studio (paid — powerful)',
    resend_key:      'Resend.com (email)',
    from_email:      'From Email',
    from_name:       'From Name',
    here_api_key:    'HERE Maps (discovery)',
    scrapingbee_key: 'ScrapingBee (free 1,000 req/mo)',
    zenrows_key:     'ZenRows (free 1,000 req/mo)',
    scrapingdog_key: 'Scrapingdog (free 1,000 req/mo)',
    firecrawl_key:   'Firecrawl (free 500 req/mo)',
    ebay_client_id:     'eBay App ID (free — developer.ebay.com)',
    ebay_client_secret: 'eBay Cert ID (free — developer.ebay.com)',
    reddit_client_id:     'Reddit App ID (free — reddit.com/prefs/apps, script app)',
    reddit_client_secret: 'Reddit App Secret (enables r/forhire live leads)',
    freelancer_api_key:   'Freelancer.com API Key (free — developers.freelancer.com)',
    millionverifier_key:  'MillionVerifier (optional ~$1/1k — resolves unknown emails)',
    public_base_url:      'Public Base URL (https://app.yourdomain.com — enables unsubscribe links)',
    company_name:         'Company Name (email footer)',
    company_address:      'Company Postal Address (required by CAN-SPAM)',
    resend_webhook_secret:'Resend Webhook Secret (wh_... from Resend dashboard)',
    imap_host:            'IMAP Host (reply detection, e.g. imap.gmail.com)',
    imap_user:            'IMAP Username (your reply mailbox)',
    imap_pass:            'IMAP Password (app password)',
  };

  return (
    <div className="space-y-2">
      {Object.entries(labels).map(([key, label]) => {
        const k = keys[key] || { set: false, preview: '' };
        const isEditing = editing[key];
        return (
          <div key={key} className="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-800 rounded-lg">
            <div className="flex-1 min-w-0">
              <p className="text-xs font-medium">{label}</p>
              {isEditing ? (
                <Input value={values[key] || ''} onChange={v => setValues({...values, [key]: v})}
                  placeholder={'Enter new ' + label} className="mt-1" type="password" />
              ) : (
                <p className="text-xs font-mono text-slate-500 truncate mt-0.5">
                  {k.set ? k.preview : <span className="text-orange-500">Not set</span>}
                </p>
              )}
            </div>
            {isEditing ? (
              <div className="flex gap-1">
                <Button size="sm" variant="success" onClick={() => save(key)} icon="Check">Save</Button>
                <Button size="sm" variant="ghost" onClick={() => cancelEdit(key)} icon="X">Cancel</Button>
              </div>
            ) : (
              <Button size="sm" variant="secondary" onClick={() => startEdit(key)} icon="Edit3">
                {k.set ? 'Change' : 'Set'}
              </Button>
            )}
          </div>
        );
      })}
    </div>
  );
};

const IntentPage = () => {
  const [query, setQuery] = useState('');
  const [direction, setDirection] = useState('demand');
  const [location, setLocation] = useState('');
  const [recency, setRecency] = useState(30);
  const [minConfFilter, setMinConfFilter] = useState(0);
  const [running, setRunning] = useState(false);
  const [results, setResults] = useState([]);
  const [status, setStatus] = useState('');
  const [savedLeads, setSavedLeads] = useState([]);
  const [stats, setStats] = useState(null);
  const [showLegend, setShowLegend] = useState(false);
  const { showToast } = useToast();

  const loadSaved = () => {
    api.get('/intent-leads?direction=' + direction + '&limit=200&min_confidence=' + minConfFilter)
      .then(d => setSavedLeads(d.leads || []))
      .catch(() => {});
    api.get('/intent-stats').then(setStats).catch(() => {});
  };

  useEffect(() => { loadSaved(); }, [direction, minConfFilter]);

  const deleteLead = async (leadId) => {
    try {
      await api.post('/intent-leads/' + leadId + '/delete', {});
      setSavedLeads(prev => prev.filter(l => l.lead_id !== leadId));
    } catch (e) { showToast('Delete failed', 'error'); }
  };

  const runSearch = async () => {
    if (!query.trim()) { showToast('Enter a query', 'error'); return; }
    setRunning(true); setResults([]); setStatus('');
    try {
      const r = await api.post('/intent-search', {
        query, direction, location, recency_days: parseInt(recency),
        min_confidence: 55, per_source_limit: 3, max_results: 30
      });
      setResults(r.results || []);
      setStatus(r.status || '');
      showToast(r.message || 'Done', r.total > 0 ? 'success' : 'info');
      loadSaved();
    } catch (e) {
      showToast('Search failed: ' + e.message, 'error');
    } finally { setRunning(false); }
  };

  const demandSamples = ['python developer', 'logo designer', 'marketing agency', 'shopify developer'];
  const supplySamples = ['python developer', 'logo designer', 'video editor', 'react developer'];
  const samples = direction === 'demand' ? demandSamples : supplySamples;

  const bandCls = (band) => band === 'High' ? 'success' : band === 'Medium' ? 'info' : 'default';

  const renderRow = (r, i, showDelete) => (
    <tr key={r.lead_id || r.url || i} className="border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50">
      <td className="py-3 px-3">
        <div className="font-medium truncate" title={r.reasoning || r.name}>{r.name || '—'}</div>
        <div className="text-xs text-slate-500 mt-0.5">{r.role_or_service || '—'}</div>
        {r.reasoning && <div className="text-xs text-slate-400 mt-0.5 line-clamp-1 max-w-xs" title={r.reasoning}>{r.reasoning}</div>}
      </td>
      <td className="py-3 px-3 text-xs">
        <Badge variant="info">{r.source_label || r.source}</Badge>
        {r.signal_count > 1 && (
          <div className="text-xs text-slate-400 mt-1 flex items-center gap-1">
            <Icon name="CheckCircle2" size={10} className="text-green-500" /> {r.signal_count} sources
          </div>
        )}
      </td>
      <td className="py-3 px-3 text-xs text-slate-500">{r.location_hint && r.location_hint !== 'unknown' ? r.location_hint : '—'}</td>
      <td className="py-3 px-3 text-xs">
        {r.contact_hint ? (
          <a href={r.contact_hint.includes('@') ? 'mailto:' + r.contact_hint : r.contact_hint}
             target="_blank" className="text-accent-600 hover:underline">{r.contact_hint}</a>
        ) : <span className="text-slate-400">—</span>}
      </td>
      <td className="py-3 px-3 text-xs text-slate-500">
        {r.posted_recency && r.posted_recency !== 'unknown' ? r.posted_recency : '—'}
      </td>
      <td className="py-3 px-3 text-center">
        <Badge variant={bandCls(r.confidence_band)} title={(r.confidence_band || '') + ' confidence — ' + r.confidence + '%'}>
          {r.confidence_band || '—'} · {r.confidence}%
        </Badge>
      </td>
      <td className="py-3 px-3 text-center">
        <div className="flex items-center justify-center gap-1">
          <a href={r.url || r.source_url} target="_blank" rel="noopener"
             className="inline-flex items-center justify-center w-8 h-8 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
             title="Open source">
            <Icon name="ExternalLink" className="w-4 h-4" />
          </a>
          {showDelete && (
            <button onClick={() => deleteLead(r.lead_id)} title="Delete lead"
              className="inline-flex items-center justify-center w-8 h-8 rounded bg-slate-100 dark:bg-slate-800 hover:bg-red-100 dark:hover:bg-red-900/30 hover:text-red-600 transition-colors">
              <Icon name="XCircle" className="w-4 h-4" />
            </button>
          )}
        </div>
      </td>
    </tr>
  );

  return (
    <div className="space-y-6 fade-in w-full">
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold">Intent Search</h1>
          <p className="text-sm text-slate-500 mt-1">Find buyers (who needs it) and providers (who offers it) — same query, opposite directions</p>
        </div>
        <div className="flex items-center gap-2">
          {stats && (
            <div className="flex gap-2 text-xs">
              <Badge variant="info">demand: {stats.by_direction?.demand || 0}</Badge>
              <Badge variant="purple">supply: {stats.by_direction?.supply || 0}</Badge>
            </div>
          )}
          <Button size="sm" variant="secondary" icon="HelpCircle" onClick={() => setShowLegend(true)}>
            How to read this
          </Button>
        </div>
      </div>

      <Card>
        <div className="space-y-4">
          <div className="flex gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-lg inline-flex">
            <button onClick={() => setDirection('demand')}
              className={'px-4 py-2 rounded-md text-sm font-semibold transition-colors ' +
                (direction === 'demand' ? 'bg-white dark:bg-slate-900 shadow text-accent-600' : 'text-slate-600 dark:text-slate-400')}>
              <Icon name="Users" className="inline w-4 h-4 mr-1" /> I need this (find buyers)
            </button>
            <button onClick={() => setDirection('supply')}
              className={'px-4 py-2 rounded-md text-sm font-semibold transition-colors ' +
                (direction === 'supply' ? 'bg-white dark:bg-slate-900 shadow text-accent-600' : 'text-slate-600 dark:text-slate-400')}>
              <Icon name="Target" className="inline w-4 h-4 mr-1" /> I provide this (find providers)
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-12 gap-2">
            <div className="md:col-span-6">
              <Input value={query} onChange={setQuery}
                placeholder={direction === 'demand' ? 'e.g. python developer, logo designer, marketing agency' : 'e.g. python developer, designer'}
                icon="Search" onKeyDown={e => e.key === 'Enter' && runSearch()} />
            </div>
            <div className="md:col-span-3">
              <Input value={location} onChange={setLocation}
                placeholder="Location (optional)" icon="MapPin"
                onKeyDown={e => e.key === 'Enter' && runSearch()} />
            </div>
            <div className="md:col-span-2">
              <select value={recency} onChange={e => setRecency(e.target.value)}
                className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="1">Past day</option>
                <option value="7">Past week</option>
                <option value="30">Past month</option>
                <option value="365">Past year</option>
              </select>
            </div>
            <div className="md:col-span-1">
              <Button onClick={runSearch} disabled={running} className="w-full">
                {running ? <Spinner /> : <Icon name="Search" className="w-4 h-4" />}
              </Button>
            </div>
          </div>

          <div className="flex gap-2 flex-wrap items-center text-xs text-slate-500">
            <span>Try:</span>
            {samples.map(s => (
              <button key={s} onClick={() => setQuery(s)}
                className="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300">
                {s}
              </button>
            ))}
          </div>
        </div>
      </Card>

      {results.length > 0 && (
        <Card noPad>
          <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between flex-wrap gap-2">
            <div>
              <h3 className="font-semibold">Fresh results</h3>
              <p className="text-xs text-slate-500 mt-0.5">
                {results.length} qualified hits {status === 'cache_hit' ? '(from 12h cache)' : '(saved to leads)'}
              </p>
            </div>
          </div>
          <div className="overflow-x-auto scrollbar-thin">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 dark:bg-slate-800/50">
                <tr className="border-b border-slate-200 dark:border-slate-800">
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Name / Role</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Source</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Location</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Contact</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Recency</th>
                  <th className="py-3 px-3 text-center font-semibold text-xs uppercase tracking-wide text-slate-500">Confidence</th>
                  <th className="py-3 px-3 text-center font-semibold text-xs uppercase tracking-wide text-slate-500">Link</th>
                </tr>
              </thead>
              <tbody>{results.map((r, i) => renderRow(r, i, false))}</tbody>
            </table>
          </div>
        </Card>
      )}

      <Card noPad>
        <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between flex-wrap gap-2">
          <div>
            <h3 className="font-semibold">Saved {direction} leads</h3>
            <p className="text-xs text-slate-500 mt-0.5">{savedLeads.length} stored — sorted by confidence</p>
          </div>
          <div className="flex items-center gap-2">
            <select value={minConfFilter} onChange={e => setMinConfFilter(Number(e.target.value))}
              className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs">
              <option value="0">All confidence levels</option>
              <option value="55">Medium+ only</option>
              <option value="75">High only</option>
            </select>
            <a href={API + '/intent-leads.csv?direction=' + direction + '&min_confidence=' + minConfFilter + '&token=' + encodeURIComponent(((() => { try { return localStorage.getItem('auth_token') || ''; } catch (e) { return ''; } })()))}
              className="text-xs text-accent-600 hover:underline flex items-center gap-1">
              <Icon name="Download" size={12} /> Download CSV
            </a>
          </div>
        </div>
        {savedLeads.length === 0 ? (
          <div className="py-12 text-center text-slate-500">
            <Icon name="Search" className="w-12 h-12 mx-auto mb-3 opacity-30" />
            <p>No {direction} leads yet. Run a search above to start.</p>
          </div>
        ) : (
          <div className="overflow-x-auto scrollbar-thin">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 dark:bg-slate-800/50">
                <tr className="border-b border-slate-200 dark:border-slate-800">
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Name / Role</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Source</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Location</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Contact</th>
                  <th className="py-3 px-3 text-left font-semibold text-xs uppercase tracking-wide text-slate-500">Recency</th>
                  <th className="py-3 px-3 text-center font-semibold text-xs uppercase tracking-wide text-slate-500">Confidence</th>
                  <th className="py-3 px-3 text-center font-semibold text-xs uppercase tracking-wide text-slate-500">Actions</th>
                </tr>
              </thead>
              <tbody>{savedLeads.map((r, i) => renderRow(r, i, true))}</tbody>
            </table>
          </div>
        )}
      </Card>

      {/* Legend modal — explains confidence bands & signal counts */}
      {showLegend && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={() => setShowLegend(false)}>
          <div className="bg-white dark:bg-slate-900 rounded-xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 flex items-center justify-between">
              <h2 className="text-lg font-bold flex items-center gap-2"><Icon name="HelpCircle" size={18} /> How to read Intent Search</h2>
              <button onClick={() => setShowLegend(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg"><Icon name="X" size={16} /></button>
            </div>
            <div className="p-5 space-y-5 text-sm">
              <div>
                <p className="font-semibold mb-2">What is this?</p>
                <p className="text-slate-500 text-xs">Intent Search scans job boards, freelance marketplaces, and social platforms for people or companies actively posting that they need (demand) or offer (supply) a specific service, then uses AI to classify whether each hit is a real, active signal — not a stale post, listicle, or irrelevant match.</p>
              </div>
              <div>
                <p className="font-semibold mb-2">Confidence bands</p>
                <div className="space-y-1.5 text-xs">
                  <p><Badge variant="success">High · 75-100%</Badge> — strong signal, safe to act on directly</p>
                  <p><Badge variant="info">Medium · 55-74%</Badge> — plausible, worth a quick manual check before outreach</p>
                  <p><Badge variant="default">Low · 0-54%</Badge> — weak signal, verify carefully before spending outreach effort</p>
                </div>
              </div>
              <div>
                <p className="font-semibold mb-2">"N sources" tag</p>
                <p className="text-slate-500 text-xs">When the same person/company is found via more than one independent source (e.g. both LinkedIn and a job board), that's a stronger signal than a single mention — shown as a green checkmark with the source count.</p>
              </div>
              <div>
                <p className="font-semibold mb-2">Recency</p>
                <p className="text-slate-500 text-xs">When available, shows how recently the post/profile was active. Job/gig posts (demand) usually have a date; static profile pages (supply) often don't, so "—" there is expected, not a bug.</p>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const LeadDetailModal = ({ leadId, onClose, onUpdate }) => {
  const [lead, setLead] = useState(null);
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const [editingEmail, setEditingEmail] = useState(false);
  const [editedSubject, setEditedSubject] = useState('');
  const [editedBody, setEditedBody] = useState('');
  const [generatingMockup, setGeneratingMockup] = useState(false);
  const [mockupPrompt, setMockupPrompt] = useState('');
  const [mockupUrl, setMockupUrl] = useState(null);
  const { showToast } = useToast();

  useEffect(() => {
    if (!leadId) return;
    setLoading(true);
    api.get('/lead/' + leadId).then(d => {
      setLead(d);
      setEditedSubject(d.email_subject || '');
      setEditedBody(d.email_body || '');
      setLoading(false);
    }).catch(e => { showToast('Failed to load: ' + e.message, 'error'); setLoading(false); });
  }, [leadId]);

  const sendEmail = async () => {
    if (!confirm('Send this email to ' + lead.owner_email + '?')) return;
    setSending(true);
    try {
      const r = await api.post('/lead/' + leadId + '/send', {});
      if (r.success) {
        showToast('Email sent successfully!');
        if (onUpdate) onUpdate();
        onClose();
      } else {
        showToast('Failed: ' + (r.error || 'Unknown error'), 'error');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    setSending(false);
  };

  const generateMockup = async () => {
    setGeneratingMockup(true);
    try {
      const r = await api.post('/lead/' + leadId + '/generate-mockup', { custom_prompt: mockupPrompt || null });
      if (r.success) {
        setMockupUrl(r.mockup_url);
        setLead(l => ({ ...l, mockup_url: r.mockup_url }));
        showToast('Mockup generated!', 'success');
        if (onUpdate) onUpdate();
      } else {
        showToast(r.error || 'Mockup generation failed', 'error');
      }
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    setGeneratingMockup(false);
  };

  const approve = async () => {
    try { await api.post('/lead/' + leadId + '/approve', {}); showToast('Approved'); if (onUpdate) onUpdate(); }
    catch (e) { showToast('Failed', 'error'); }
  };
  const reject = async () => {
    if (!confirm('Reject this lead?')) return;
    try { await api.post('/lead/' + leadId + '/reject', {}); showToast('Rejected'); if (onUpdate) onUpdate(); onClose(); }
    catch (e) { showToast('Failed', 'error'); }
  };
  const regenerate = async () => {
    try {
      const r = await api.post('/lead/' + leadId + '/regenerate-email', {});
      if (r.success) {
        setEditedSubject(r.subject);
        setEditedBody(r.body);
        showToast('Email regenerated');
      }
    } catch (e) { showToast('Failed', 'error'); }
  };

  if (!leadId) return null;

  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-slate-900 rounded-xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto scrollbar-thin" onClick={e => e.stopPropagation()}>
        {loading ? (
          <div className="p-12 text-center"><Spinner size="w-8 h-8" /></div>
        ) : !lead ? (
          <div className="p-12 text-center text-slate-500">Lead not found</div>
        ) : (
          <>
            <div className="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-5 flex items-center justify-between">
              <div className="min-w-0 flex-1">
                <h2 className="text-lg font-bold truncate">{lead.business_name}</h2>
                <p className="text-xs text-slate-500">{lead.niche} • {lead.city}, {lead.country} • Status: <Badge variant="info">{lead.status}</Badge></p>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>
            <div className="p-5 space-y-4">
              {/* Contact info */}
              <div className="grid grid-cols-2 gap-3">
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Phone</p>
                  <p className="font-mono text-sm text-cyan-600">{lead.phone || '—'}</p>
                </div>
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Email</p>
                  <p className="font-mono text-sm text-cyan-600 truncate">{lead.owner_email || '—'}</p>
                </div>
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Owner</p>
                  <p className="text-sm">{lead.owner_name || '—'}</p>
                </div>
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">AI Score</p>
                  <p className="text-sm font-bold">{lead.ai_score ? lead.ai_score + '/10' : '—'}</p>
                </div>
              </div>
              {lead.address && (
                <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <p className="text-xs text-slate-500">Address</p>
                  <p className="text-sm">{lead.address}</p>
                </div>
              )}
              {lead.linkedin_url && (
                <a href={lead.linkedin_url} target="_blank" className="block p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg hover:bg-blue-100">
                  <p className="text-xs text-slate-500">LinkedIn</p>
                  <p className="text-sm text-blue-600">{lead.linkedin_url}</p>
                </a>
              )}

              {/* Timeline */}
              <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                <p className="text-xs text-slate-500 uppercase font-medium mb-2">Activity Timeline</p>
                <div className="space-y-1.5">
                  <div className="flex items-center gap-2 text-xs">
                    <span className="w-2 h-2 rounded-full bg-green-400 flex-shrink-0"></span>
                    <span className="text-slate-500 w-24">Discovered</span>
                    <span className="font-mono text-slate-700 dark:text-slate-300">{lead.date_found || '—'}</span>
                  </div>
                  {lead.status !== 'discovered' && (
                    <div className="flex items-center gap-2 text-xs">
                      <span className="w-2 h-2 rounded-full bg-accent-400 flex-shrink-0"></span>
                      <span className="text-slate-500 w-24">Last updated</span>
                      <span className="font-mono text-slate-700 dark:text-slate-300">{lead.date_updated || '—'}</span>
                    </div>
                  )}
                  <div className="flex items-center gap-2 text-xs">
                    <span className="w-2 h-2 rounded-full bg-amber-400 flex-shrink-0"></span>
                    <span className="text-slate-500 w-24">Status</span>
                    <Badge variant={lead.status === 'ready' ? 'success' : lead.status === 'sent' ? 'purple' : lead.status === 'enriched' ? 'info' : 'default'}>{lead.status}</Badge>
                  </div>
                </div>
              </div>

              {/* Mockup */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs text-slate-500 uppercase font-medium">Website Mockup</p>
                </div>
                {(mockupUrl || lead.mockup_url) && (
                  <img src={mockupUrl || lead.mockup_url} alt="Mockup" className="w-full rounded-lg border border-slate-200 dark:border-slate-800 mb-3" />
                )}
                <div className="space-y-2 bg-slate-50 dark:bg-slate-800 rounded-lg p-3">
                  <p className="text-xs text-slate-500 font-medium">Custom prompt (optional)</p>
                  <textarea
                    value={mockupPrompt}
                    onChange={e => setMockupPrompt(e.target.value)}
                    placeholder={`e.g. "Dark modern theme with ${lead.niche} imagery, blue accent colors, hero section with a call-to-action button"`}
                    rows={2}
                    className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-accent-500"
                  />
                  <Button size="sm" variant="primary" icon={generatingMockup ? null : 'Image'} onClick={generateMockup} disabled={generatingMockup}>
                    {generatingMockup ? <><Spinner /><span className="ml-2">Generating…</span></> : (mockupUrl || lead.mockup_url) ? 'Regenerate Mockup' : 'Generate Mockup'}
                  </Button>
                  <p className="text-xs text-slate-400">Uses Replicate or imagine.art — configure image provider in Settings</p>
                </div>
              </div>

              {/* Email preview / editor */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs text-slate-500 uppercase font-medium">Email Preview</p>
                  <div className="flex gap-2">
                    <Button size="sm" variant="ghost" onClick={() => setEditingEmail(!editingEmail)} icon="Edit3">
                      {editingEmail ? 'Done' : 'Edit'}
                    </Button>
                    <Button size="sm" variant="ghost" onClick={regenerate} icon="RotateCw">Regenerate</Button>
                  </div>
                </div>
                {editingEmail ? (
                  <div className="space-y-2">
                    <Input value={editedSubject} onChange={setEditedSubject} placeholder="Subject" />
                    <textarea value={editedBody} onChange={e => setEditedBody(e.target.value)}
                      className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-3 text-sm font-mono min-h-[200px]" />
                  </div>
                ) : (
                  <div className="bg-slate-50 dark:bg-slate-800 rounded-lg p-4 border border-slate-200 dark:border-slate-700">
                    <p className="font-semibold text-sm mb-2">{editedSubject || lead.email_subject || '(no subject)'}</p>
                    <div className="text-sm whitespace-pre-wrap">{editedBody || lead.email_body || '(no body)'}</div>
                  </div>
                )}
              </div>

              {/* Actions */}
              <div className="flex gap-2 sticky bottom-0 bg-white dark:bg-slate-900 pt-3 border-t border-slate-200 dark:border-slate-800">
                <Button onClick={sendEmail} variant="success" icon="Send" disabled={sending || !lead.owner_email || lead.status === 'sent'}>
                  {sending ? <Spinner /> : lead.status === 'sent' ? 'Already Sent' : 'Send Email'}
                </Button>
                <Button onClick={approve} variant="primary" icon="Check">Approve</Button>
                <Button onClick={reject} variant="danger" icon="XCircle">Reject</Button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
};

const OutreachPage = () => {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedLead, setSelectedLead] = useState(null);
  const [outreachLog, setOutreachLog] = useState([]);
  const [view, setView] = useState('ready');

  const refresh = () => {
    setLoading(true);
    Promise.all([
      api.get('/leads').catch(() => ({ leads: [] })),
      api.get('/outreach').catch(() => ({ log: [] }))
    ]).then(([l, o]) => {
      setLeads(l.leads || []);
      setOutreachLog(o.log || []);
      setLoading(false);
    });
  };
  useEffect(refresh, []);

  const readyLeads = leads.filter(l => l.status === 'ready' && l.owner_email);
  const approvedLeads = leads.filter(l => l.status === 'approved');
  const sentCount = outreachLog.length;

  let displayed = readyLeads;
  if (view === 'approved') displayed = approvedLeads;
  else if (view === 'sent') displayed = outreachLog;

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Outreach</h1>
        <p className="text-sm text-slate-500 mt-1">Review and send personalized emails</p>
      </div>

      <div className="grid grid-cols-3 gap-3">
        <button onClick={() => setView('ready')}
          className={'p-4 rounded-xl border-2 text-left transition-colors ' + (
            view === 'ready' ? 'border-accent-500 bg-accent-50 dark:bg-accent-900/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'
          )}>
          <div className="flex items-center gap-2">
            <Icon name="Inbox" className="w-5 h-5 text-accent-600" />
            <span className="text-sm font-medium">Ready</span>
          </div>
          <p className="text-2xl font-bold mt-1">{readyLeads.length}</p>
        </button>
        <button onClick={() => setView('approved')}
          className={'p-4 rounded-xl border-2 text-left ' + (
            view === 'approved' ? 'border-green-500 bg-green-50 dark:bg-green-900/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'
          )}>
          <div className="flex items-center gap-2">
            <Icon name="Check" className="w-5 h-5 text-green-600" />
            <span className="text-sm font-medium">Approved</span>
          </div>
          <p className="text-2xl font-bold mt-1">{approvedLeads.length}</p>
        </button>
        <button onClick={() => setView('sent')}
          className={'p-4 rounded-xl border-2 text-left ' + (
            view === 'sent' ? 'border-amber-500 bg-amber-50 dark:bg-amber-900/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'
          )}>
          <div className="flex items-center gap-2">
            <Icon name="Send" className="w-5 h-5 text-amber-600" />
            <span className="text-sm font-medium">Sent</span>
          </div>
          <p className="text-2xl font-bold mt-1">{sentCount}</p>
        </button>
      </div>

      {loading ? (
        <Card><div className="py-12 text-center"><Spinner size="w-6 h-6" /></div></Card>
      ) : view === 'sent' ? (
        <Card>
          <h3 className="font-semibold mb-3">Sent Emails</h3>
          {outreachLog.length === 0 ? (
            <p className="text-sm text-slate-500 py-8 text-center">No emails sent yet</p>
          ) : (
            <div className="space-y-2">
              {outreachLog.map((o, i) => (
                <div key={i} className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">
                  <div className="flex items-center justify-between">
                    <div className="min-w-0 flex-1">
                      <p className="font-medium text-sm">{o.business_name}</p>
                      <p className="text-xs text-slate-500 truncate">{o.email_subject}</p>
                      <p className="text-xs font-mono text-cyan-600 truncate">{o.email_to}</p>
                    </div>
                    <div className="ml-2 text-right text-xs">
                      <Badge variant={o.status === 'sent' ? 'success' : 'info'}>{o.status}</Badge>
                      <p className="text-slate-500 mt-1">{o.sent_at ? new Date(o.sent_at).toLocaleString() : ''}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>
      ) : (
        <div className="space-y-3">
          {displayed.length === 0 ? (
            <Card>
              <div className="py-12 text-center text-slate-500">
                <p>No leads {view === 'ready' ? 'ready for review' : 'approved'} yet</p>
                <p className="text-xs mt-2">Go to <strong>Pipeline</strong> page and run enrichment first</p>
              </div>
            </Card>
          ) : displayed.map((l, i) => (
            <Card key={i} className="hover:border-accent-300 transition-colors cursor-pointer" >
              <div onClick={() => setSelectedLead(l.id || l.business_name)} className="cursor-pointer">
                <div className="flex items-start justify-between gap-4">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 mb-2">
                      <h3 className="font-semibold">{l.business_name}</h3>
                      {l.ai_score && <Badge variant={parseInt(l.ai_score) >= 8 ? 'success' : 'info'}>{l.ai_score}/10</Badge>}
                      <Badge variant="info">{l.city}</Badge>
                    </div>
                    <p className="text-sm text-slate-600 dark:text-slate-400">
                      <strong>To:</strong> {l.owner_email}
                    </p>
                    {l.email_subject && (
                      <p className="text-sm font-medium mt-2">{l.email_subject}</p>
                    )}
                    {l.email_body && (
                      <p className="text-xs text-slate-500 mt-1 line-clamp-2">{l.email_body.substring(0, 200)}...</p>
                    )}
                  </div>
                  {l.mockup_url && (
                    <img src={l.mockup_url} alt="Mockup" className="w-24 h-16 object-cover rounded border border-slate-200 dark:border-slate-800" />
                  )}
                </div>
                <div className="mt-3 flex justify-end">
                  <Button size="sm" variant="ghost" icon="ExternalLink">Open</Button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      {selectedLead && (
        <LeadDetailModal leadId={selectedLead} onClose={() => setSelectedLead(null)} onUpdate={refresh} />
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────
//  Analytics / Charts Page
// ─────────────────────────────────────────────────
const SimpleBarChart = ({ data, label = 'count', max }) => {
  const maxVal = max || Math.max(...data.map(d => d[label]), 1);
  return (
    <div className="space-y-2">
      {data.map((d, i) => (
        <div key={i} className="flex items-center gap-2">
          <div className="text-xs w-32 truncate text-slate-600 dark:text-slate-400">{d.niche || d.city || d.status || d.bucket || d.date}</div>
          <div className="flex-1 h-6 bg-slate-100 dark:bg-slate-800 rounded overflow-hidden relative">
            <div className="h-full bg-gradient-to-r from-accent-400 to-accent-600 rounded transition-all"
              style={{ width: ((d[label] / maxVal) * 100) + '%' }} />
            <span className="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium">{d[label]}</span>
          </div>
        </div>
      ))}
    </div>
  );
};

const AnalyticsPage = () => {
  const [charts, setCharts] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api.get('/stats-chart').then(d => { setCharts(d); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  if (loading) return <div className="text-center py-12"><Spinner size="w-6 h-6" /></div>;
  if (!charts) return <div>Failed to load</div>;

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-2xl font-bold">Analytics</h1>
        <p className="text-sm text-slate-500 mt-1">Visualize pipeline performance</p>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Activity" /> Leads Per Day (14 days)</h3>
          {charts.leads_per_day.length === 0 ? (
            <p className="text-sm text-slate-500 py-8 text-center">No data yet</p>
          ) : (
            <SimpleBarChart data={charts.leads_per_day} />
          )}
        </Card>

        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="PieChart" /> Status Breakdown</h3>
          <SimpleBarChart data={charts.status_breakdown} />
        </Card>

        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Tag" /> Top Niches</h3>
          <SimpleBarChart data={charts.niche_breakdown} />
        </Card>

        <Card>
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="MapPin" /> Top Cities</h3>
          <SimpleBarChart data={charts.city_breakdown} />
        </Card>

        <Card className="lg:col-span-2">
          <h3 className="font-semibold mb-4 flex items-center gap-2"><Icon name="Star" /> AI Score Distribution</h3>
          <SimpleBarChart data={charts.score_distribution} />
        </Card>
      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────
//  Auth: Login Screen
// ─────────────────────────────────────────────────
const LoginScreen = ({ onLogin }) => {
  const [username, setUsername] = useState('admin');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const submit = async () => {
    setLoading(true); setError('');
    try {
      const r = await api.post('/auth/login', { username, password });
      if ((r.success || r.status === 'ok') && r.token) {
        localStorage.setItem('auth_token', r.token);
        onLogin(r.token);
      } else {
        setError(r.error || 'Invalid credentials');
      }
    } catch (e) { setError('Login failed: ' + e.message); }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 to-accent-50 dark:from-slate-950 dark:to-slate-900">
      <Card className="w-full max-w-md">
        <div className="text-center mb-6">
          <div className="w-16 h-16 mx-auto bg-gradient-to-br from-accent-500 to-accent-700 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-xl pulse-glow">C</div>
          <h1 className="text-xl font-bold mt-4">Controva Intelligence</h1>
          <p className="text-sm text-slate-500 mt-1">Sign in to continue</p>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">Username</label>
            <Input value={username} onChange={setUsername} icon="User" />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">Password</label>
            <Input value={password} onChange={setPassword} type="password" icon="Lock"
              onKeyDown={e => e.key === 'Enter' && submit()} />
          </div>
          {error && <p className="text-xs text-red-600 dark:text-red-400">{error}</p>}
          <Button onClick={submit} disabled={loading} className="w-full" icon="Lock">
            {loading ? <Spinner /> : 'Sign In'}
          </Button>
        </div>
      </Card>
    </div>
  );
};


// ─────────────────────────────────────────────────
//  Main App
// ─────────────────────────────────────────────────
const App = () => {
  const [theme, toggleTheme] = useTheme();
  const [page, setPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const nav = [
    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'search',    label: 'Search',    icon: 'Search' },
    { id: 'leads',     label: 'Leads',     icon: 'Users' },
    { id: 'pipeline',  label: 'Pipeline',  icon: 'Workflow' },
    { id: 'outreach',  label: 'Outreach',  icon: 'Send' },
    { id: 'analytics', label: 'Analytics', icon: 'Activity' },
    { id: 'divider1' },
    { id: 'intent',    label: 'Intent',    icon: 'Crosshair' },
    { id: 'seo',         label: 'SEO',         icon: 'TrendingUp' },
    { id: 'competitor',  label: 'Competitors', icon: 'Target' },
    { id: 'people',      label: 'People',      icon: 'UserSearch' },
    { id: 'social',      label: 'Social',      icon: 'Share2' },
    { id: 'ecommerce',   label: 'E-commerce',  icon: 'ShoppingBag' },
    { id: 'divider2' },
    { id: 'settings',  label: 'Settings',  icon: 'Settings' },
  ];

  let CurrentPage = DashboardPage;
  if (page === 'search') CurrentPage = SearchPage;
  else if (page === 'leads') CurrentPage = LeadsPage;
  else if (page === 'pipeline') CurrentPage = PipelinePage;
  else if (page === 'seo') CurrentPage = SEOPage;
  else if (page === 'competitor') CurrentPage = CompetitorPage;
  else if (page === 'people') CurrentPage = PeoplePage;
  else if (page === 'social') CurrentPage = SocialPage;
  else if (page === 'ecommerce') CurrentPage = EcommercePage;
  else if (page === 'outreach') CurrentPage = OutreachPage;
  else if (page === 'analytics') CurrentPage = AnalyticsPage;
  else if (page === 'intent') CurrentPage = IntentPage;
  else if (page === 'settings') CurrentPage = SettingsPage;

  return (
    <div className="min-h-screen flex">
      <aside className={(sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0') + ' fixed lg:sticky top-0 z-40 w-64 h-screen bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-transform flex flex-col'}>
        <div className="p-5 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 bg-gradient-to-br from-accent-500 to-accent-700 rounded-lg flex items-center justify-center text-white font-bold shadow-lg pulse-glow">C</div>
            <div>
              <p className="font-bold text-sm leading-tight">Controva</p>
              <p className="text-xs text-slate-500">Intelligence Platform</p>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-0.5 overflow-y-auto scrollbar-thin flex-1">
          {nav.map(item => item.id.indexOf('divider') === 0 ? (
            <div key={item.id} className="my-2 border-t border-slate-200 dark:border-slate-800" />
          ) : (
            <button key={item.id} onClick={() => { setPage(item.id); setSidebarOpen(false); }}
              className={'w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors ' + (
                page === item.id ? 'bg-accent-50 dark:bg-accent-900/30 text-accent-700 dark:text-accent-400'
                                 : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
              )}>
              <Icon name={item.icon} className="w-4 h-4" />
              {item.label}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-slate-200 dark:border-slate-800">
          <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
            <Icon name={theme === 'dark' ? 'Sun' : 'Moon'} className="w-4 h-4" />
            {theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
          </button>
        </div>
      </aside>
      {sidebarOpen && <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 z-30 bg-black/50 lg:hidden" />}
      <main className="flex-1 min-w-0">
        <header className="sticky top-0 z-20 bg-white/80 dark:bg-slate-950/80 glass border-b border-slate-200 dark:border-slate-800">
          <div className="px-5 py-3 flex items-center justify-between">
            <button onClick={() => setSidebarOpen(true)} className="lg:hidden p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800">
              <Icon name="Menu" className="w-5 h-5" />
            </button>
            <div className="flex items-center gap-2 text-xs text-slate-500">
              <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse" />
              <span>Server online</span>
            </div>
          </div>
        </header>
        <div className="p-5 lg:p-8 w-full">
          <CurrentPage setPage={setPage} />
        </div>
      </main>
    </div>
  );
};

// Auth wrapper
const AuthWrapper = () => {
  const [authToken, setAuthToken] = useState(() => {
    try { return localStorage.getItem('auth_token'); } catch (e) { return null; }
  });
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    if (!authToken) { setChecking(false); return; }
    api.post('/auth/check', { token: authToken })
      .then(r => { if (!r.authenticated) { setAuthToken(null); try { localStorage.removeItem('auth_token'); } catch (e) {} } })
      .finally(() => setChecking(false));
  }, []);

  if (checking) return <div className="min-h-screen flex items-center justify-center"><Spinner size="w-8 h-8" /></div>;
  if (!authToken) return <LoginScreen onLogin={(t) => setAuthToken(t)} />;
  return <App />;
};

// Mount
ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider><AuthWrapper /></ToastProvider>
);
</script>

</body>
