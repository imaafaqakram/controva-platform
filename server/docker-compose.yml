version: "3.9"

services:

  # ── PostgreSQL 16 — Primary Lead Database ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: leadgen_postgres
    restart: always
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: ${LEADGEN_DB_PASS:?Set LEADGEN_DB_PASS in .env next to this file}
      POSTGRES_DB: leadgen_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/leadgen/postgres/data:/var/lib/postgresql/data
      - /opt/leadgen/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — not reachable from outside the server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadgen_network

  # ── Redis 7 — Queue Manager & Deduplication ────────────────
  redis:
    image: redis:7-alpine
    container_name: leadgen_redis
    restart: always
    command: redis-server --requirepass "${LEADGEN_REDIS_PASS:?Set LEADGEN_REDIS_PASS in .env}" --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/leadgen/redis/data:/data
    ports:
      - "127.0.0.1:6379:6379"   # Internal only
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$LEADGEN_REDIS_PASS\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadgen_network

  # ── Crawl4AI — Self-Hosted Web Scraper (Oxylabs backup) ────
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: leadgen_crawl4ai
    restart: always
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN:?Set CRAWL4AI_TOKEN in .env}
    ports:
      - "127.0.0.1:11235:11235"  # Internal only
    shm_size: "1gb"
    volumes:
      - /opt/leadgen/crawl4ai:/crawl4ai
    networks:
      - leadgen_network
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  leadgen_network:
    driver: bridge
